<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jos</title>
  <style>
    :root {
      --p: #4c1d95;
      --bg: #f4f5f9;
      --card: #ffffff;
      --txt: #111827;
      --mut: #6b7280;
      --ok: #059669;
      --bad: #dc2626;
      --ed: #2563eb;
      --bd: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--txt);
    }
    .hide { display: none !important; }
    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: linear-gradient(150deg, #2e1065, var(--p));
    }
    .box {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,.22);
    }
    header {
      background: var(--p);
      color: #fff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand { font-weight: 800; font-size: 18px; }
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: #ede9fe;
      padding: 8px;
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .tab {
      flex: 1;
      min-width: 110px;
      background: transparent;
      color: var(--p);
      padding: 9px 10px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      border: 0;
    }
    .tab.active {
      background: var(--p);
      color: #fff;
    }
    .wrap { max-width: 920px; margin: auto; padding: 14px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.05);
    }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat {
      background: #f9fafb;
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 12px;
    }
    .stat small { color: var(--mut); display: block; font-size: 12px; }
    .stat b { font-size: 18px; color: var(--p); }
    label { display: block; font-size: 13px; font-weight: 600; margin-top: 6px; }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background: #fff;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 13px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-p { background: var(--p); color: #fff; width: 100%; }
    .btn-ok { background: var(--ok); color: #fff; }
    .btn-ed { background: #dbeafe; color: var(--ed); }
    .btn-del { background: #fee2e2; color: var(--bad); }
    .btn-top { background: rgba(255,255,255,.16); color: #fff; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid #f1f5f9;
      flex-wrap: wrap;
    }
    .row:last-child { border-bottom: 0; }
    .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #374151;
      margin-top: 4px;
    }
    .line-box {
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fcfcfd;
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 50;
    }
    .panel {
      width: 100%;
      max-width: 460px;
      max-height: 86vh;
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      padding: 18px;
    }
  </style>
</head>
<body>
  <div id="loginBox" class="login">
    <div class="box">
      <h2 style="margin:0 0 6px;color:var(--p)">Jos</h2>
      <p style="margin:0 0 12px;color:var(--mut);font-size:13px">تسجيل الدخول لإدارة الباقات والتوزيع والعملاء والشهور</p>
      <div id="err" style="color:var(--bad);font-size:13px;margin-bottom:8px"></div>
      <form id="fLogin" novalidate>
        <label>اسم المستخدم</label>
        <input id="u" type="text" placeholder="1234" autocomplete="username" />
        <label>كلمة المرور</label>
        <input id="p" type="password" placeholder="admin" autocomplete="current-password" />
        <button id="loginBtn" class="btn-p" type="submit">دخول</button>
      </form>
      <button id="fill" type="button" style="width:100%;margin-top:8px;background:#111827;color:#fff">تعبئة 1234 / admin</button>
    </div>
  </div>

  <div id="app" class="hide">
    <header>
      <div class="brand">Jos</div>
      <div class="acts">
        <button id="openGear" class="btn-top" type="button" title="تعديل الأسعار سريعاً">⚙️ الأسعار</button>
        <button id="outBtn" class="btn-top" type="button">خروج</button>
      </div>
    </header>

    <div class="wrap">
      <div class="tabs">
        <button class="tab active" data-tab="pkgs" type="button">الباقات والأسعار</button>
        <button class="tab" data-tab="dist" type="button">توزيع الخطوط الذكي</button>
        <button class="tab" data-tab="clients" type="button">العملاء وأرقامهم</button>
        <button class="tab" data-tab="months" type="button">ملخص الشهور</button>
      </div>

      <section id="tab-pkgs">
        <div class="card">
          <h3 style="margin:0 0 8px">إضافة باقة جديدة</h3>
          <form id="fAddPkg" class="grid2">
            <div>
              <label>اسم الباقة</label>
              <input id="pName" placeholder="مثال: باقة 130 جيجا" required />
            </div>
            <div>
              <label>السعة (GB)</label>
              <input id="pGb" type="number" min="1" placeholder="130" required />
            </div>
            <div>
              <label>السعر (جنيه)</label>
              <input id="pPrice" type="number" min="0" step="0.5" placeholder="210" required />
            </div>
            <div style="display:flex;align-items:flex-end">
              <button class="btn-p" type="submit">إضافة الباقة</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h3 style="margin:0 0 10px">قائمة الباقات والأسعار</h3>
          <div id="pkgList"></div>
        </div>
      </section>

      <section id="tab-dist" class="hide">
        <div class="card">
          <h3 style="margin:0 0 8px">توزيع الباقات والتوزيع الذكي للخطوط</h3>
          <div class="grid2">
            <div>
              <label>الشهر الحالي للتوزيع</label>
              <input id="distMonth" type="month" />
            </div>
            <div>
              <label>الحد الأقصى للمشتركين في الخط الواحد</label>
              <input id="maxPerLine" type="number" min="1" max="20" value="6" />
            </div>
            <div>
              <label>اختيار باقة للتوزيع</label>
              <select id="distPkgSelect"></select>
            </div>
            <div>
              <label>عدد المشتركين المطلوب توزيعهم</label>
              <input id="distUsersCount" type="number" min="1" value="6" />
            </div>
          </div>
          <button id="runSmartDist" class="btn-p" type="button">حساب وتوزيع الخطوط الذكي</button>
        </div>

        <div id="distSummary" class="stats"></div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
            <h3 style="margin:0">نتيجة توزيع الخطوط</h3>
            <button id="saveDistToMonth" class="btn-ok" type="button">ترحيل التوزيع إلى ملخص الشهر</button>
          </div>
          <div id="distResult"></div>
        </div>
      </section>

      <section id="tab-clients" class="hide">
        <div class="card">
          <h3 style="margin:0 0 8px">إضافة عميل جديد</h3>
          <form id="fAddClient" class="grid2">
            <div>
              <label>اسم العميل</label>
              <input id="cName" placeholder="اسم العميل" required />
            </div>
            <div>
              <label>رقم الهاتف / الموبايل</label>
              <input id="cPhone" type="tel" placeholder="010xxxxxxxx" required />
            </div>
            <div>
              <label>الباقة</label>
              <select id="cPkg"></select>
            </div>
            <div>
              <label>رقم الخط الموزع عليه (اختياري)</label>
              <input id="cLine" placeholder="مثال: خط 1" />
            </div>
            <div>
              <label>حالة الدفع</label>
              <select id="cStatus">
                <option value="مدفوع">مدفوع</option>
                <option value="مستحق">مستحق</option>
              </select>
            </div>
            <div style="display:flex;align-items:flex-end">
              <button class="btn-p" type="submit">حفظ العميل</button>
            </div>
          </form>
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
            <h3 style="margin:0">العملاء وأرقامهم</h3>
            <input id="cSearch" placeholder="ابحث بالاسم أو الرقم أو الخط..." style="max-width:260px;margin:0" />
          </div>
          <div id="clientList"></div>
        </div>
      </section>

      <section id="tab-months" class="hide">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
            <h3 style="margin:0">بيان ملخص الشهور</h3>
            <button id="snapshotMonth" class="btn-ok" type="button">حفظ لقطة الشهر الحالي</button>
          </div>
          <div id="monthsStats" class="stats"></div>
          <div id="monthsList"></div>
        </div>
      </section>
    </div>
  </div>

  <div id="modal" class="modal hide">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 id="modalTitle" style="margin:0">تعديل</h3>
        <button id="closeModal" type="button">✕</button>
      </div>
      <div id="modalBody"></div>
      <button id="modalSave" class="btn-ok" type="button" style="width:100%;margin-top:10px">حفظ التعديلات</button>
    </div>
  </div>

  <script>
    const DB_KEY = "jos_full_manager_v2";
    const defaultMonth = new Date().toISOString().slice(0, 7);

    const initialData = {
      pkgs: [
        { name: "باقة 130 جيجا", gb: 130, price: 210 },
        { name: "باقة 190 جيجا", gb: 190, price: 290 },
        { name: "باقة 200 جيجا", gb: 200, price: 310 }
      ],
      clients: [],
      months: [],
      lastDist: null
    };

    let db = JSON.parse(localStorage.getItem(DB_KEY) || "null") || initialData;
    const persist = () => localStorage.setItem(DB_KEY, JSON.stringify(db));

    const loginBox = document.getElementById("loginBox");
    const app = document.getElementById("app");
    const err = document.getElementById("err");
    const u = document.getElementById("u");
    const p = document.getElementById("p");
    const fLogin = document.getElementById("fLogin");
    const fill = document.getElementById("fill");
    const outBtn = document.getElementById("outBtn");
    const openGear = document.getElementById("openGear");
    const fAddPkg = document.getElementById("fAddPkg");
    const pName = document.getElementById("pName");
    const pGb = document.getElementById("pGb");
    const pPrice = document.getElementById("pPrice");
    const pkgList = document.getElementById("pkgList");
    const distMonth = document.getElementById("distMonth");
    const maxPerLine = document.getElementById("maxPerLine");
    const distPkgSelect = document.getElementById("distPkgSelect");
    const distUsersCount = document.getElementById("distUsersCount");
    const runSmartDist = document.getElementById("runSmartDist");
    const distSummary = document.getElementById("distSummary");
    const distResult = document.getElementById("distResult");
    const saveDistToMonth = document.getElementById("saveDistToMonth");
    const fAddClient = document.getElementById("fAddClient");
    const cName = document.getElementById("cName");
    const cPhone = document.getElementById("cPhone");
    const cPkg = document.getElementById("cPkg");
    const cLine = document.getElementById("cLine");
    const cStatus = document.getElementById("cStatus");
    const cSearch = document.getElementById("cSearch");
    const clientList = document.getElementById("clientList");
    const snapshotMonth = document.getElementById("snapshotMonth");
    const monthsStats = document.getElementById("monthsStats");
    const monthsList = document.getElementById("monthsList");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const closeModal = document.getElementById("closeModal");
    const modalSave = document.getElementById("modalSave");

    distMonth.value = defaultMonth;

    function enterApp() {
      err.textContent = "";
      loginBox.classList.add("hide");
      app.classList.remove("hide");
      renderAll();
    }

    function attemptLogin() {
      const userVal = (u.value || "").trim();
      const passVal = (p.value || "").trim();
      if ((userVal === "1234" && passVal === "admin") || (!userVal && !passVal)) {
        enterApp();
      } else {
        err.textContent = "بيانات الدخول غير صحيحة — استخدم 1234 و admin أو اضغط تعبئة 1234 / admin";
      }
    }

    fill.onclick = () => {
      u.value = "1234";
      p.value = "admin";
      enterApp();
    };

    fLogin.onsubmit = (e) => {
      e.preventDefault();
      attemptLogin();
    };

    outBtn.onclick = () => {
      app.classList.add("hide");
      loginBox.classList.remove("hide");
    };

    document.querySelectorAll(".tab").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        const target = btn.dataset.tab;
        ["pkgs", "dist", "clients", "months"].forEach(sec => {
          document.getElementById("tab-" + sec).classList.toggle("hide", sec !== target);
        });
        renderAll();
      };
    });

    fAddPkg.onsubmit = (e) => {
      e.preventDefault();
      db.pkgs.push({
        name: pName.value.trim(),
        gb: +pGb.value,
        price: +pPrice.value
      });
      persist();
      fAddPkg.reset();
      renderAll();
    };

    window.deletePkg = (idx) => {
      db.pkgs.splice(idx, 1);
      persist();
      renderAll();
    };

    let modalMode = null;
    let editIdx = null;

    window.editSinglePkg = (idx) => {
      modalMode = "singlePkg";
      editIdx = idx;
      const item = db.pkgs[idx];
      modalTitle.textContent = "تعديل الباقة وسعرها";
      modalBody.innerHTML = `
        <label>اسم الباقة</label>
        <input id="mPkgName" type="text" value="${item.name}" />
        <label>السعة (GB)</label>
        <input id="mPkgGb" type="number" min="1" value="${item.gb}" />
        <label>السعر (جنيه)</label>
        <input id="mPkgPrice" type="number" min="0" step="0.5" value="${item.price}" />
      `;
      modal.classList.remove("hide");
    };

    openGear.onclick = () => {
      modalMode = "allPrices";
      modalTitle.textContent = "⚙️ تعديل أسعار جميع الباقات";
      modalBody.innerHTML = db.pkgs.map((item, i) => `
        <label>${item.name} (${item.gb} GB)</label>
        <input type="number" step="0.5" data-pidx="${i}" value="${item.price}" />
      `).join("") || "<p>لا توجد باقات</p>";
      modal.classList.remove("hide");
    };

    window.editClient = (idx) => {
      modalMode = "client";
      editIdx = idx;
      const cl = db.clients[idx];
      modalTitle.textContent = "تعديل بيانات العميل";
      modalBody.innerHTML = `
        <label>اسم العميل</label>
        <input id="mCName" type="text" value="${cl.name}" />
        <label>رقم الهاتف</label>
        <input id="mCPhone" type="tel" value="${cl.phone}" />
        <label>الباقة</label>
        <select id="mCPkg">
          ${db.pkgs.map(pk => `<option value="${pk.name}" ${pk.name === cl.pkg ? "selected" : ""}>${pk.name} (${pk.price} ج)</option>`).join("")}
        </select>
        <label>رقم الخط</label>
        <input id="mCLine" type="text" value="${cl.line || ""}" />
        <label>حالة الدفع</label>
        <select id="mCStatus">
          <option value="مدفوع" ${cl.status === "مدفوع" ? "selected" : ""}>مدفوع</option>
          <option value="مستحق" ${cl.status === "مستحق" ? "selected" : ""}>مستحق</option>
        </select>
      `;
      modal.classList.remove("hide");
    };

    closeModal.onclick = () => modal.classList.add("hide");

    modalSave.onclick = () => {
      if (modalMode === "singlePkg" && editIdx !== null) {
        const nVal = document.getElementById("mPkgName").value.trim();
        const gVal = +document.getElementById("mPkgGb").value;
        const prVal = +document.getElementById("mPkgPrice").value;
        if (nVal) db.pkgs[editIdx].name = nVal;
        if (gVal > 0) db.pkgs[editIdx].gb = gVal;
        db.pkgs[editIdx].price = prVal;
      } else if (modalMode === "allPrices") {
        modalBody.querySelectorAll("input[data-pidx]").forEach(inp => {
          db.pkgs[+inp.dataset.pidx].price = +inp.value;
        });
      } else if (modalMode === "client" && editIdx !== null) {
        db.clients[editIdx] = {
          ...db.clients[editIdx],
          name: document.getElementById("mCName").value.trim(),
          phone: document.getElementById("mCPhone").value.trim(),
          pkg: document.getElementById("mCPkg").value,
          line: document.getElementById("mCLine").value.trim(),
          status: document.getElementById("mCStatus").value
        };
      }
      persist();
      modal.classList.add("hide");
      renderAll();
    };

    function computeSmartDistribution() {
      const pkgIdx = +distPkgSelect.value || 0;
      const pkg = db.pkgs[pkgIdx] || { name: "باقة", gb: 130, price: 210 };
      const users = Math.max(1, +distUsersCount.value || 1);
      const cap = Math.max(1, +maxPerLine.value || 6);
      const linesCount = Math.ceil(users / cap);
      const totalGb = linesCount * pkg.gb;
      const totalPrice = linesCount * pkg.price;

      const lines = [];
      let remainingUsers = users;
      for (let i = 1; i <= linesCount; i++) {
        const assigned = Math.min(cap, remainingUsers);
        remainingUsers -= assigned;
        const shareGb = +(pkg.gb / assigned).toFixed(1);
        lines.push({
          lineNumber: i,
          users: assigned,
          cap,
          pkgName: pkg.name,
          gb: pkg.gb,
          price: pkg.price,
          shareGb
        });
      }

      db.lastDist = {
        month: distMonth.value || defaultMonth,
        pkgName: pkg.name,
        users,
        cap,
        linesCount,
        totalGb,
        totalPrice,
        lines
      };
      persist();
      renderDistribution();
    }

    runSmartDist.onclick = computeSmartDistribution;

    function renderDistribution() {
      const d = db.lastDist;
      if (!d) {
        distSummary.innerHTML = "";
        distResult.innerHTML = "<p style='color:var(--mut)'>اختر الباقة وعدد المشتركين واضغط حساب التوزيع الذكي.</p>";
        return;
      }
      distSummary.innerHTML = `
        <div class="stat"><small>عدد الخطوط المطلوبة</small><b>${d.linesCount} خط</b></div>
        <div class="stat"><small>إجمالي المشتركين</small><b>${d.users} مشترك</b></div>
        <div class="stat"><small>إجمالي الجيجابايت</small><b>${d.totalGb} GB</b></div>
        <div class="stat"><small>إجمالي التكلفة</small><b>${d.totalPrice} ج</b></div>
      `;
      distResult.innerHTML = d.lines.map(l => `
        <div class="line-box">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
            <b>خط رقم ${l.lineNumber} — ${l.pkgName}</b>
            <span class="badge">${l.users} / ${l.cap} مشترك</span>
          </div>
          <div style="font-size:13px;color:var(--mut);margin-top:6px">
            سعة الخط: <b>${l.gb} GB</b> | نصيب الفرد التقريبي: <b>${l.shareGb} GB</b> | سعر الخط: <b>${l.price} ج</b>
          </div>
        </div>
      `).join("");
    }

    fAddClient.onsubmit = (e) => {
      e.preventDefault();
      db.clients.push({
        name: cName.value.trim(),
        phone: cPhone.value.trim(),
        pkg: cPkg.value,
        line: cLine.value.trim(),
        status: cStatus.value,
        month: distMonth.value || defaultMonth
      });
      persist();
      fAddClient.reset();
      renderAll();
    };

    window.deleteClient = (idx) => {
      db.clients.splice(idx, 1);
      persist();
      renderAll();
    };

    cSearch.oninput = renderClients;

    function renderClients() {
      const q = (cSearch.value || "").trim().toLowerCase();
      const filtered = db.clients.filter(c =>
        c.name.toLowerCase().includes(q) ||
        c.phone.toLowerCase().includes(q) ||
        (c.line || "").toLowerCase().includes(q) ||
        (c.pkg || "").toLowerCase().includes(q)
      );
      if (!filtered.length) {
        clientList.innerHTML = "<p style='color:var(--mut)'>لا يوجد عملاء مطابقون حالياً.</p>";
        return;
      }
      clientList.innerHTML = filtered.map((c) => {
        const realIdx = db.clients.indexOf(c);
        return `
          <div class="row">
            <div>
              <b>${c.name}</b> — <span style="direction:ltr;display:inline-block">${c.phone}</span>
              <div>
                <span class="badge">الباقة: ${c.pkg || "-"}</span>
                ${c.line ? `<span class="badge">الخط: ${c.line}</span>` : ""}
                <span class="badge">${c.status}</span>
              </div>
            </div>
            <div class="acts">
              <button class="btn-ed" onclick="editClient(${realIdx})" type="button">تعديل</button>
              <button class="btn-del" onclick="deleteClient(${realIdx})" type="button">حذف</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function saveMonthSnapshot(fromDist = false) {
      const monthKey = distMonth.value || defaultMonth;
      const d = db.lastDist;
      const monthClients = db.clients.filter(c => (c.month || defaultMonth) === monthKey);
      const clientsCount = monthClients.length || db.clients.length;
      const linesCount = fromDist && d ? d.linesCount : Math.max(1, Math.ceil(clientsCount / Math.max(1, +maxPerLine.value || 6)));
      const totalGb = fromDist && d ? d.totalGb : linesCount * (db.pkgs[0]?.gb || 130);
      const totalAmount = fromDist && d ? d.totalPrice : linesCount * (db.pkgs[0]?.price || 210);

      const existingIdx = db.months.findIndex(m => m.month === monthKey);
      const entry = {
        month: monthKey,
        linesCount,
        clientsCount,
        totalGb,
        totalAmount
      };
      if (existingIdx >= 0) db.months[existingIdx] = entry;
      else db.months.unshift(entry);

      persist();
      renderMonths();
    }

    saveDistToMonth.onclick = () => {
      if (!db.lastDist) computeSmartDistribution();
      saveMonthSnapshot(true);
      document.querySelector('.tab[data-tab="months"]').click();
    };

    snapshotMonth.onclick = () => saveMonthSnapshot(false);

    window.deleteMonth = (idx) => {
      db.months.splice(idx, 1);
      persist();
      renderMonths();
    };

    function renderMonths() {
      const totalLines = db.months.reduce((s, m) => s + (m.linesCount || 0), 0);
      const totalGb = db.months.reduce((s, m) => s + (m.totalGb || 0), 0);
      const totalMoney = db.months.reduce((s, m) => s + (m.totalAmount || 0), 0);

      monthsStats.innerHTML = `
        <div class="stat"><small>عدد الشهور المسجلة</small><b>${db.months.length} شهر</b></div>
        <div class="stat"><small>مجموع الخطوط</small><b>${totalLines} خط</b></div>
        <div class="stat"><small>مجموع السعات</small><b>${totalGb} GB</b></div>
        <div class="stat"><small>إجمالي المبالغ</small><b>${totalMoney} ج</b></div>
      `;

      if (!db.months.length) {
        monthsList.innerHTML = "<p style='color:var(--mut)'>لم يتم حفظ ملخصات شهور بعد. اضغط «حفظ لقطة الشهر الحالي» أو رحّل التوزيع الذكي.</p>";
        return;
      }

      monthsList.innerHTML = db.months.map((m, i) => `
        <div class="row">
          <div>
            <b>شهر ${m.month}</b>
            <div>
              <span class="badge">الخطوط: ${m.linesCount}</span>
              <span class="badge">العملاء: ${m.clientsCount}</span>
              <span class="badge">السعة: ${m.totalGb} GB</span>
              <span class="badge">الإجمالي: ${m.totalAmount} ج</span>
            </div>
          </div>
          <button class="btn-del" onclick="deleteMonth(${i})" type="button">حذف</button>
        </div>
      `).join("");
    }

    function renderPkgs() {
      if (!db.pkgs.length) {
        pkgList.innerHTML = "<p style='color:var(--mut)'>لا توجد باقات مضافة.</p>";
        return;
      }
      pkgList.innerHTML = db.pkgs.map((p, i) => `
        <div class="row">
          <div>
            <b>${p.name}</b>
            <div style="font-size:12px;color:var(--mut)">${p.gb} GB</div>
          </div>
          <div class="acts">
            <b>${p.price} ج</b>
            <button class="btn-ed" onclick="editSinglePkg(${i})" type="button">تعديل</button>
            <button class="btn-del" onclick="deletePkg(${i})" type="button">حذف</button>
          </div>
        </div>
      `).join("");

      const prevDist = distPkgSelect.value;
      const prevClient = cPkg.value;

      distPkgSelect.innerHTML = db.pkgs.map((p, i) =>
        `<option value="${i}">${p.name} — ${p.gb} GB (${p.price} ج)</option>`
      ).join("");
      cPkg.innerHTML = db.pkgs.map(p =>
        `<option value="${p.name}">${p.name} (${p.price} ج)</option>`
      ).join("");

      if (prevDist) distPkgSelect.value = prevDist;
      if (prevClient) cPkg.value = prevClient;
    }

    function renderAll() {
      renderPkgs();
      renderDistribution();
      renderClients();
      renderMonths();
    }
  </script>
</body>
</html>
