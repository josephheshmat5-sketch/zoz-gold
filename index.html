<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#5c2d91" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="zoz Gold" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='26' fill='%235c2d91'/%3E%3Ctext x='64' y='79' font-family='Arial,sans-serif' font-size='44' font-weight='bold' text-anchor='middle' fill='white'%3EZZ%3C/text%3E%3C/svg%3E" />
  <title>zoz Gold - إدارة الخطوط والعملاء</title>
  <style>
    :root {
      --primary: #5c2d91;
      --primary-dark: #431d6e;
      --primary-light: #7b42bc;
      --primary-bg: #f3ebf9;
      --bg-body: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --warning: #f59e0b;
      --warning-dark: #b45309;
      --warning-bg: #fffbeb;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 18px rgba(92, 45, 145, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; overflow-x: hidden; padding-bottom: 84px; }
    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .w-full { width: 100%; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.35rem; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .text-muted { color: var(--text-muted); }
    .text-primary { color: var(--primary); }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }
    .text-warning { color: var(--warning-dark); }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }

    .app-header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: #fff; padding: 14px 16px 16px; border-bottom-left-radius: 22px; border-bottom-right-radius: 22px; box-shadow: var(--shadow-md); position: sticky; top: 0; z-index: 50; }
    .header-icon-btn { background: rgba(255, 255, 255, 0.22); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 9px; height: 30px; padding: 0 9px; font-size: 0.76rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
    .month-bar { background: rgba(255, 255, 255, 0.14); border-radius: var(--radius-md); padding: 6px 10px; margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .month-select { background: transparent; color: #fff; border: none; font-weight: 800; font-size: 0.95rem; outline: none; cursor: pointer; padding: 4px; flex: 1; text-align: center; }
    .month-select option { color: var(--text-main); background: #fff; }
    .month-nav-btn { background: rgba(255, 255, 255, 0.22); color: #fff; border: none; width: 34px; height: 34px; border-radius: 9px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .container { max-width: 600px; margin: 0 auto; padding: 14px; }
    .card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 15px; margin-bottom: 12px; box-shadow: var(--shadow-sm); border: 1px solid rgba(226, 232, 240, 0.9); }
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .kpi-card { background: #fff; border-radius: var(--radius-lg); padding: 13px; box-shadow: var(--shadow-sm); border-inline-start: 4px solid var(--primary); }
    .kpi-card.success { border-inline-start-color: var(--success); }
    .kpi-card.warning { border-inline-start-color: var(--warning); }
    .kpi-card.danger { border-inline-start-color: var(--danger); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.88rem; font-weight: 700; border: none; cursor: pointer; transition: transform 0.12s; white-space: nowrap; }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--text-main); }
    .btn-soft { background: var(--primary-bg); color: var(--primary); }
    .btn-sm { padding: 7px 11px; font-size: 0.8rem; border-radius: var(--radius-sm); }
    .btn-xs { padding: 5px 9px; font-size: 0.74rem; border-radius: 8px; }
    .btn-edit-pkg { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; border-radius: 8px; padding: 4px 9px; font-size: 0.74rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
    .badge-primary { background: var(--primary-bg); color: var(--primary); }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning-dark); }

    .form-group { margin-bottom: 10px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }
    .input { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; color: var(--text-main); background: #fff; outline: none; }
    .input:focus { border-color: var(--primary); }

    .progress-track { width: 100%; height: 9px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin: 7px 0 4px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 999px; }
    .progress-fill.full { background: var(--success); }

    .slot-item { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--radius-md); border: 1.5px solid var(--border); margin-top: 8px; background: #fff; }
    .full-client-name { font-weight: 800; font-size: 0.93rem; color: var(--text-main); word-break: break-word; }
    .chart-row { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); height: 68px; z-index: 60; box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06); }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-muted); font-size: 0.67rem; font-weight: 800; cursor: pointer; padding: 4px 2px; }
    .nav-btn svg { width: 20px; height: 20px; stroke-width: 2.1; }
    .nav-btn.active { color: var(--primary); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); display: flex; align-items: flex-end; justify-content: center; z-index: 200; padding: 12px; }
    @media (min-width: 540px) { .modal-backdrop { align-items: center; } }
    .modal-box { background: #fff; width: 100%; max-width: 460px; border-radius: 22px; padding: 20px; max-height: 88vh; overflow-y: auto; }
    .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 0.84rem; font-weight: 700; z-index: 9999; max-width: 92vw; }

    .lock-screen { position: fixed; inset: 0; background: linear-gradient(155deg, #2d124d 0%, #5c2d91 55%, #7b42bc 100%); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 18px; }
    .lock-card { background: #ffffff; width: 100%; max-width: 400px; border-radius: 26px; padding: 26px 22px; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35); text-align: center; }
    .lock-logo { width: 68px; height: 68px; background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: #fff; font-weight: 900; font-size: 1.25rem; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
    .btn-fingerprint { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; border: 1.5px solid #334155; padding: 12px 16px; border-radius: 14px; font-size: 0.92rem; font-weight: 800; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-top: 10px; }
    .pkg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 11px; margin-bottom: 8px; background: #f8fafc; flex-wrap: wrap; }
  </style>
</head>
<body>

  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-logo">zoz Gold</div>
      <h1 class="text-lg font-extrabold">zoz Gold</h1>
      <p class="text-xs text-muted mb-3">إدارة الباقات والخطوط والعملاء • أوفلاين</p>
      <div id="login-error-box" class="hidden text-xs font-bold text-danger mb-2" style="background:var(--danger-bg); padding:8px; border-radius:10px;"></div>
      <form onsubmit="handlePasswordLogin(event)" style="text-align:start;">
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input type="text" id="login-username" class="input" placeholder="admin" required />
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" id="login-password" class="input" placeholder="1234" required />
        </div>
        <button type="submit" class="btn btn-primary w-full">🔓 دخول بالرقم السري</button>
      </form>
      <button type="button" onclick="loginWithFingerprint()" class="btn-fingerprint">
        <span>تسجيل / الدخول بالبصمة 👆</span>
      </button>
      <div class="text-xs text-muted mt-2">الافتراضي: <strong>admin</strong> / <strong>1234</strong></div>
    </div>
  </div>

  <header class="app-header">
    <div class="flex items-center justify-between gap-2">
      <div>
        <div class="flex items-center gap-2">
          <span style="background:#fff;color:var(--primary);font-weight:900;padding:2px 9px;border-radius:8px;font-size:0.85rem;">zoz Gold</span>
          <span class="font-extrabold text-base">zoz Gold</span>
        </div>
        <div class="text-xs" style="opacity:0.92;margin-top:2px;">يعمل أوفلاين بالكامل</div>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" onclick="openAddMonthModal()" class="header-icon-btn">+ شهر</button>
        <button type="button" onclick="openSettingsModal()" class="header-icon-btn">⚙️ إعدادات</button>
        <button type="button" onclick="logoutApp()" class="header-icon-btn" style="background:rgba(239,68,68,0.88);">🚪 خروج</button>
      </div>
    </div>

    <div class="month-bar">
      <button type="button" class="month-nav-btn" onclick="stepMonth(-1)">&#9654;</button>
      <select id="month-selector" class="month-select" onchange="selectMonth(this.value)"></select>
      <button type="button" class="month-nav-btn" onclick="stepMonth(1)">&#9664;</button>
    </div>
  </header>

  <main id="app-content" class="container"></main>

  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" data-nav="dashboard" onclick="switchTab('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>الرئيسية</span>
    </button>
    <button type="button" class="nav-btn" data-nav="lines" onclick="switchTab('lines')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>الخطوط</span>
    </button>
    <button type="button" class="nav-btn" data-nav="clients" onclick="switchTab('clients')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>العملاء</span>
    </button>
    <button type="button" class="nav-btn" data-nav="packages" onclick="switchTab('packages')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      <span>الباقات</span>
    </button>
    <button type="button" class="nav-btn" data-nav="reports" onclick="switchTab('reports')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>الملخص</span>
    </button>
  </nav>

  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="closeModalOnBackdrop(event)">
    <div id="modal-box" class="modal-box" onclick="event.stopPropagation()"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const STORAGE_KEY = "zoz_gold_state_v2";
    const AUTH_KEY = "zoz_gold_auth_v2";

    const defaultState = {
      currentMonth: "2026-11",
      activeTab: "dashboard",
      smartUsers: 12,
      smartMaxPerLine: 6,
      smartPkgId: "pkg-200",
      packages: [
        { id: "pkg-130", name: "باقة 130 جيجا", gb: 130, price: 210, cost: 170 },
        { id: "pkg-190", name: "باقة 190 جيجا", gb: 190, price: 290, cost: 240 },
        { id: "pkg-200", name: "باقة 200 جيجا", gb: 200, price: 310, cost: 255 }
      ],
      months: {
        "2026-11": {
          label: "نوفمبر 2026",
          lines: [
            { id: "L-1", name: "خط WE 01", pkgId: "pkg-200", maxSlots: 6 },
            { id: "L-2", name: "خط WE 02", pkgId: "pkg-130", maxSlots: 6 }
          ],
          clients: [
            { id: "C-1", name: "عميل 1", phone: "01000000001", pkgId: "pkg-200", lineId: "L-1", gbShare: 40, amount: 80, paid: 80 },
            { id: "C-2", name: "عميل 2", phone: "01000000002", pkgId: "pkg-130", lineId: "L-2", gbShare: 30, amount: 60, paid: 30 }
          ]
        }
      }
    };

    const cloneDefault = () => JSON.parse(JSON.stringify(defaultState));
    let state = loadState();
    let isLoggedIn = sessionStorage.getItem(AUTH_KEY) === "1";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return cloneDefault();
        const parsed = JSON.parse(raw);
        return { ...cloneDefault(), ...parsed };
      } catch {
        return cloneDefault();
      }
    }

    const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("hidden");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add("hidden"), 2300);
    }

    function updateLockScreen() {
      document.getElementById("lock-screen").classList.toggle("hidden", isLoggedIn);
    }

    function handlePasswordLogin(e) {
      e.preventDefault();
      const u = document.getElementById("login-username").value.trim();
      const p = document.getElementById("login-password").value.trim();
      const err = document.getElementById("login-error-box");
      if ((u === "admin" && p === "1234") || (u === "1234" && p === "admin")) {
        err.classList.add("hidden");
        isLoggedIn = true;
        sessionStorage.setItem(AUTH_KEY, "1");
        updateLockScreen();
        renderAll();
        showToast("تم الدخول بنجاح");
      } else {
        err.textContent = "بيانات الدخول غير صحيحة (admin / 1234)";
        err.classList.remove("hidden");
      }
    }

    function loginWithFingerprint() {
      isLoggedIn = true;
      sessionStorage.setItem(AUTH_KEY, "1");
      updateLockScreen();
      renderAll();
      showToast("تم الدخول بالبصمة");
    }

    function logoutApp() {
      isLoggedIn = false;
      sessionStorage.removeItem(AUTH_KEY);
      updateLockScreen();
    }

    const getMonthKeys = () => Object.keys(state.months).sort();
    const getCurrentMonthData = () => state.months[state.currentMonth] || state.months[getMonthKeys()[0]];
    const getPkgById = (id) => state.packages.find(p => p.id === id) || state.packages[0] || { id: "", name: "باقة", gb: 130, price: 210, cost: 170 };

    function renderMonthSelector() {
      const sel = document.getElementById("month-selector");
      sel.innerHTML = getMonthKeys().map(k => `<option value="${k}" ${k === state.currentMonth ? "selected" : ""}>${state.months[k].label || k} (${k})</option>`).join("");
    }

    function selectMonth(v) { state.currentMonth = v; saveState(); renderAll(); }
    function stepMonth(d) {
      const keys = getMonthKeys();
      const i = keys.indexOf(state.currentMonth) + d;
      if (i >= 0 && i < keys.length) { state.currentMonth = keys[i]; saveState(); renderAll(); }
      else showToast("لا يوجد شهر إضافي");
    }

    function openAddMonthModal() {
      openModal(`
        <h3 class="font-extrabold text-base mb-3">إضافة شهر جديد</h3>
        <form onsubmit="submitAddMonth(event)">
          <div class="form-group"><label class="form-label">الشهر</label><input type="month" id="nm-key" class="input" value="2026-12" required /></div>
          <div class="form-group"><label class="form-label">الاسم</label><input type="text" id="nm-lbl" class="input" placeholder="ديسمبر 2026" required /></div>
          <button type="submit" class="btn btn-primary w-full">إضافة</button>
        </form>
      `);
    }

    function submitAddMonth(e) {
      e.preventDefault();
      const k = document.getElementById("nm-key").value.trim();
      const lbl = document.getElementById("nm-lbl").value.trim();
      const prev = getCurrentMonthData();
      if (!state.months[k]) {
        state.months[k] = { label: lbl || k, lines: [...prev.lines], clients: prev.clients.map(c => ({ ...c, paid: 0 })) };
      }
      state.currentMonth = k;
      saveState(); closeModal(); renderAll();
      showToast("تمت إضافة الشهر");
    }

    function switchTab(tab) {
      state.activeTab = tab;
      saveState();
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.nav === tab));
      renderContent();
    }

    function renderDashboard() {
      const m = getCurrentMonthData();
      const rev = m.clients.reduce((s, c) => s + (+c.amount || 0), 0);
      const paid = m.clients.reduce((s, c) => s + (+c.paid || 0), 0);
      const due = Math.max(0, rev - paid);
      const linesCost = m.lines.reduce((s, l) => s + (+getPkgById(l.pkgId).price || 0), 0);
      const net = rev - linesCost;

      return `
        <div class="kpi-grid">
          <div class="kpi-card"><div class="text-xs text-muted font-bold">إجمالي الفواتير</div><div class="text-xl font-extrabold text-primary mt-1">${rev} ج</div><div class="text-xs text-muted mt-1">${m.clients.length} عميل • ${m.lines.length} خط</div></div>
          <div class="kpi-card success"><div class="text-xs text-muted font-bold">المحصل فعلياً</div><div class="text-xl font-extrabold text-success mt-1">${paid} ج</div><div class="text-xs text-muted mt-1">متبقي: ${due} ج</div></div>
          <div class="kpi-card warning"><div class="text-xs text-muted font-bold">تكلفة الخطوط</div><div class="text-xl font-extrabold text-warning mt-1">${linesCost} ج</div></div>
          <div class="kpi-card ${net >= 0 ? "success" : "danger"}"><div class="text-xs text-muted font-bold">صافي التقدير</div><div class="text-xl font-extrabold ${net >= 0 ? "text-success" : "text-danger"} mt-1">${net} ج</div></div>
        </div>

        <div class="card">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-extrabold text-base">الباقات والأسعار السريعة</h3>
            <button type="button" class="btn btn-soft btn-xs" onclick="openAddPackageModal()">+ إضافة باقة</button>
          </div>
          ${state.packages.map(pkg => `
            <div class="pkg-row">
              <div><div class="font-bold text-sm">${pkg.name}</div><div class="text-xs text-muted">${pkg.gb} GB • السعر: <strong class="text-primary">${pkg.price} ج</strong></div></div>
              <div class="flex items-center gap-1">
                <button type="button" class="btn-edit-pkg" onclick="openEditPackageModal('${pkg.id}')">✏️ تعديل</button>
                <button type="button" class="btn btn-danger btn-xs" onclick="deletePackage('${pkg.id}')">حذف</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderLinesTab() {
      const m = getCurrentMonthData();
      const pkg = getPkgById(state.smartPkgId);
      const users = Math.max(1, +state.smartUsers || 1);
      const maxCap = Math.max(1, +state.smartMaxPerLine || 6);
      const neededLines = Math.ceil(users / maxCap);
      const shareGb = +(pkg.gb / Math.min(users, maxCap)).toFixed(1);

      let smartCards = "";
      let rem = users;
      for (let i = 1; i <= neededLines; i++) {
        const uInLine = Math.min(maxCap, rem);
        rem -= uInLine;
        smartCards += `<div class="slot-item"><div class="flex items-center justify-between"><span class="font-bold text-sm">خط مقترح #${i} (${pkg.name})</span><span class="badge badge-primary">${uInLine}/${maxCap} مشترك</span></div><div class="text-xs text-muted">سعة الباقة: ${pkg.gb} GB • نصيب الفرد: ${+(pkg.gb / uInLine).toFixed(1)} GB</div></div>`;
      }

      return `
        <div class="card">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-extrabold text-base">التوزيع الذكي للخطوط</h3>
            <span class="badge badge-success">${neededLines} خط مطلوب</span>
          </div>
          <div class="form-group"><label class="form-label">الباقة</label><select class="input" onchange="state.smartPkgId=this.value;saveState();renderContent();">${state.packages.map(p => `<option value="${p.id}" ${p.id === pkg.id ? "selected" : ""}>${p.name} (${p.gb} GB - ${p.price} ج)</option>`).join("")}</select></div>
          <div class="flex gap-2">
            <div class="form-group w-full"><label class="form-label">عدد المشتركين</label><input type="number" min="1" class="input" value="${users}" onchange="state.smartUsers=+this.value||1;saveState();renderContent();" /></div>
            <div class="form-group w-full"><label class="form-label">حد الخط</label><input type="number" min="1" max="20" class="input" value="${maxCap}" onchange="state.smartMaxPerLine=+this.value||6;saveState();renderContent();" /></div>
          </div>
          <div class="text-xs text-muted mb-2">إجمالي السعة المطلوبة: <strong>${neededLines * pkg.gb} GB</strong> • التكلفة: <strong>${neededLines * pkg.price} ج</strong> • حصة تقديرية: <strong>${shareGb} GB</strong></div>
          <button type="button" class="btn btn-success btn-sm w-full mb-2" onclick="applySmartLines()">اعتماد وتوليد الخطوط في الشهر</button>
          ${smartCards}
        </div>

        <div class="card">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-extrabold text-base">الخطوط الحالية (${m.lines.length})</h3>
            <button type="button" class="btn btn-primary btn-sm" onclick="openAddLineModal()">+ إضافة خط</button>
          </div>
          ${m.lines.map(line => {
            const p = getPkgById(line.pkgId);
            const cl = m.clients.filter(c => c.lineId === line.id);
            const used = cl.reduce((s, x) => s + (+x.gbShare || 0), 0);
            const pct = Math.min(100, Math.round((used / (p.gb || 1)) * 100));
            return `<div class="slot-item"><div class="flex items-center justify-between"><span class="full-client-name">${line.name}</span><span class="badge badge-primary">${cl.length}/${line.maxSlots || 6}</span></div><div class="text-xs text-muted">${p.name} • ${p.gb} GB • ${p.price} ج</div><div class="progress-track"><div class="progress-fill ${pct >= 100 ? "full" : ""}" style="width:${pct}%"></div></div><div class="text-xs text-muted">الموزع: <strong>${used} GB</strong> (${pct}%)</div></div>`;
          }).join("")}
        </div>
      `;
    }

    function applySmartLines() {
      const m = getCurrentMonthData();
      const pkg = getPkgById(state.smartPkgId);
      const users = Math.max(1, +state.smartUsers || 1);
      const maxCap = Math.max(1, +state.smartMaxPerLine || 6);
      const count = Math.ceil(users / maxCap);
      m.lines = [];
      for (let i = 1; i <= count; i++) {
        m.lines.push({ id: "L-" + Date.now() + "-" + i, name: `خط ${pkg.gb}G #${i}`, pkgId: pkg.id, maxSlots: maxCap });
      }
      saveState();
      renderAll();
      showToast(`تم إنشاء ${count} خط بالتوزيع الذكي`);
    }

    function renderClientsTab() {
      const m = getCurrentMonthData();
      return `
        <div class="card">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-extrabold text-base">العملاء وتوزيع الباقات (${m.clients.length})</h3>
            <button type="button" class="btn btn-primary btn-sm" onclick="openAddClientModal()">+ إضافة عميل</button>
          </div>
          ${m.clients.map(c => {
            const pkg = getPkgById(c.pkgId);
            const line = m.lines.find(l => l.id === c.lineId);
            const rem = Math.max(0, (+c.amount || 0) - (+c.paid || 0));
            return `
              <div class="slot-item">
                <div class="flex items-center justify-between">
                  <div>
                    <div class="full-client-name">${c.name}</div>
                    <div class="text-xs text-muted">${c.phone || "-"} • ${pkg.name} • ${line ? line.name : "بدون خط"} • حصة: <strong>${c.gbShare || 0} GB</strong></div>
                  </div>
                  <span class="badge ${rem === 0 ? "badge-success" : "badge-warning"}">${rem === 0 ? "خالص" : "متبقي " + rem + " ج"}</span>
                </div>
                <div class="flex items-center justify-between text-xs mt-1">
                  <span>الفاتورة: <strong>${c.amount || 0} ج</strong> • المدفوع: <strong>${c.paid || 0} ج</strong></span>
                  <div class="flex gap-1">
                    <button type="button" class="btn btn-success btn-xs" onclick="markClientPaid('${c.id}')">تحصيل كامل</button>
                    <button type="button" class="btn btn-danger btn-xs" onclick="deleteClient('${c.id}')">حذف</button>
                  </div>
                </div>
              </div>
            `;
          }).join("") || `<p class="text-xs text-muted">لا يوجد عملاء بعد.</p>`}
        </div>
      `;
    }

    function markClientPaid(id) {
      const c = getCurrentMonthData().clients.find(x => x.id === id);
      if (!c) return;
      c.paid = +c.amount || 0;
      saveState(); renderAll(); showToast("تم تسجيل التحصيل");
    }

    function openAddClientModal() {
      const m = getCurrentMonthData();
      openModal(`
        <h3 class="font-extrabold text-base mb-3">إضافة عميل وتوزيع حصة</h3>
        <form onsubmit="submitAddClient(event)">
          <div class="form-group"><label class="form-label">اسم العميل</label><input type="text" id="cl-name" class="input" required /></div>
          <div class="form-group"><label class="form-label">رقم الموبايل</label><input type="tel" id="cl-phone" class="input" /></div>
          <div class="form-group"><label class="form-label">الباقة</label><select id="cl-pkg" class="input">${state.packages.map(p => `<option value="${p.id}">${p.name} (${p.price} ج)</option>`).join("")}</select></div>
          <div class="form-group"><label class="form-label">توزيع على خط</label><select id="cl-line" class="input"><option value="">بدون خط</option>${m.lines.map(l => `<option value="${l.id}">${l.name}</option>`).join("")}</select></div>
          <div class="form-group"><label class="form-label">الحصة (GB)</label><input type="number" id="cl-gb" class="input" min="0" value="30" /></div>
          <div class="form-group"><label class="form-label">قيمة الفاتورة (جنيه)</label><input type="number" id="cl-amount" class="input" min="0" value="70" /></div>
          <div class="form-group"><label class="form-label">المدفوع (جنيه)</label><input type="number" id="cl-paid" class="input" min="0" value="0" /></div>
          <button type="submit" class="btn btn-primary w-full">حفظ العميل</button>
        </form>
      `);
    }

    function submitAddClient(e) {
      e.preventDefault();
      getCurrentMonthData().clients.push({
        id: "C-" + Date.now(),
        name: document.getElementById("cl-name").value.trim(),
        phone: document.getElementById("cl-phone").value.trim(),
        pkgId: document.getElementById("cl-pkg").value,
        lineId: document.getElementById("cl-line").value,
        gbShare: +document.getElementById("cl-gb").value || 0,
        amount: +document.getElementById("cl-amount").value || 0,
        paid: +document.getElementById("cl-paid").value || 0
      });
      saveState(); closeModal(); renderAll(); showToast("تمت إضافة العميل");
    }

    function deleteClient(id) {
      const m = getCurrentMonthData();
      m.clients = m.clients.filter(c => c.id !== id);
      saveState(); renderAll(); showToast("تم حذف العميل");
    }

    function renderPackagesTab() {
      return `
        <div class="card">
          <div class="flex items-center justify-between mb-3">
            <div><h3 class="font-extrabold text-base">الباقات والأسعار</h3><p class="text-xs text-muted">إضافة باقة جديدة أو تعديل اسم وسعة وسعر أي باقة</p></div>
            <button type="button" class="btn btn-primary btn-sm" onclick="openAddPackageModal()">+ باقة جديدة</button>
          </div>
          ${state.packages.map(pkg => `
            <div class="pkg-row">
              <div><div class="font-bold text-sm">${pkg.name}</div><div class="text-xs text-muted">السعة: <strong>${pkg.gb} GB</strong> • السعر: <strong class="text-primary">${pkg.price} ج</strong> • التكلفة: <strong>${pkg.cost || 0} ج</strong></div></div>
              <div class="flex items-center gap-1">
                <button type="button" class="btn-edit-pkg" onclick="openEditPackageModal('${pkg.id}')">✏️ تعديل الباقة وسعرها</button>
                <button type="button" class="btn btn-danger btn-xs" onclick="deletePackage('${pkg.id}')">حذف</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openAddPackageModal() {
      openModal(`
        <h3 class="font-extrabold text-base mb-3">إضافة باقة جديدة</h3>
        <form onsubmit="submitAddPackage(event)">
          <div class="form-group"><label class="form-label">اسم الباقة</label><input type="text" id="pkg-name" class="input" required /></div>
          <div class="form-group"><label class="form-label">السعة (GB)</label><input type="number" id="pkg-gb" class="input" min="1" required /></div>
          <div class="form-group"><label class="form-label">السعر (جنيه)</label><input type="number" id="pkg-price" class="input" min="0" step="0.5" required /></div>
          <div class="form-group"><label class="form-label">التكلفة</label><input type="number" id="pkg-cost" class="input" min="0" step="0.5" value="0" /></div>
          <button type="submit" class="btn btn-primary w-full">حفظ الباقة</button>
        </form>
      `);
    }

    function submitAddPackage(e) {
      e.preventDefault();
      state.packages.push({
        id: "pkg-" + Date.now(),
        name: document.getElementById("pkg-name").value.trim(),
        gb: +document.getElementById("pkg-gb").value,
        price: +document.getElementById("pkg-price").value,
        cost: +document.getElementById("pkg-cost").value || 0
      });
      saveState(); closeModal(); renderAll(); showToast("تمت إضافة الباقة");
    }

    function openEditPackageModal(id) {
      const pkg = state.packages.find(p => p.id === id);
      if (!pkg) return;
      openModal(`
        <h3 class="font-extrabold text-base mb-3">تعديل الباقة وسعرها</h3>
        <form onsubmit="submitEditPackage(event, '${pkg.id}')">
          <div class="form-group"><label class="form-label">اسم الباقة</label><input type="text" id="ep-name" class="input" value="${pkg.name}" required /></div>
          <div class="form-group"><label class="form-label">السعة (GB)</label><input type="number" id="ep-gb" class="input" min="1" value="${pkg.gb}" required /></div>
          <div class="form-group"><label class="form-label">السعر (جنيه)</label><input type="number" id="ep-price" class="input" min="0" step="0.5" value="${pkg.price}" required /></div>
          <div class="form-group"><label class="form-label">التكلفة</label><input type="number" id="ep-cost" class="input" min="0" step="0.5" value="${pkg.cost || 0}" /></div>
          <button type="submit" class="btn btn-success w-full">حفظ التعديلات</button>
        </form>
      `);
    }

    function submitEditPackage(e, id) {
      e.preventDefault();
      const pkg = state.packages.find(p => p.id === id);
      if (!pkg) return;
      pkg.name = document.getElementById("ep-name").value.trim() || pkg.name;
      pkg.gb = +document.getElementById("ep-gb").value || pkg.gb;
      pkg.price = +document.getElementById("ep-price").value;
      pkg.cost = +document.getElementById("ep-cost").value || 0;
      saveState(); closeModal(); renderAll(); showToast("تم تحديث الباقة وسعرها");
    }

    function deletePackage(id) {
      if (state.packages.length <= 1) { showToast("يجب بقاء باقة واحدة على الأقل"); return; }
      state.packages = state.packages.filter(p => p.id !== id);
      saveState(); renderAll(); showToast("تم حذف الباقة");
    }

    function renderReportsTab() {
      return `
        <div class="card">
          <h3 class="font-extrabold text-base mb-3">ملخص الشهور</h3>
          ${getMonthKeys().map(k => {
            const md = state.months[k];
            const rev = md.clients.reduce((s, c) => s + (+c.amount || 0), 0);
            const paid = md.clients.reduce((s, c) => s + (+c.paid || 0), 0);
            const gb = md.clients.reduce((s, c) => s + (+c.gbShare || 0), 0);
            return `<div class="chart-row"><div class="flex items-center justify-between"><span class="font-bold text-sm">${md.label || k} (${k})</span><span class="badge badge-primary">${md.lines.length} خط • ${md.clients.length} عميل</span></div><div class="text-xs text-muted mt-1">الفواتير: <strong>${rev} ج</strong> • المحصل: <strong class="text-success">${paid} ج</strong> • الحصص: <strong>${gb} GB</strong></div></div>`;
          }).join("")}
        </div>
      `;
    }

    function openSettingsModal() {
      openModal(`
        <h3 class="font-extrabold text-base mb-3">إعدادات zoz Gold</h3>
        <p class="text-xs text-muted mb-3">البيانات محفوظة محلياً وتعمل أوفلاين.</p>
        <button type="button" class="btn btn-danger btn-sm" onclick="resetAllData()">إعادة ضبط البيانات الافتراضية</button>
      `);
    }

    function resetAllData() { state = cloneDefault(); saveState(); closeModal(); renderAll(); showToast("تمت إعادة الضبط"); }
    function openModal(html) { document.getElementById("modal-box").innerHTML = html; document.getElementById("modal-backdrop").classList.remove("hidden"); }
    function closeModal() { document.getElementById("modal-backdrop").classList.add("hidden"); }
    function closeModalOnBackdrop(e) { if (e.target.id === "modal-backdrop") closeModal(); }

    function renderContent() {
      const el = document.getElementById("app-content");
      if (state.activeTab === "lines") el.innerHTML = renderLinesTab();
      else if (state.activeTab === "clients") el.innerHTML = renderClientsTab();
      else if (state.activeTab === "packages") el.innerHTML = renderPackagesTab();
      else if (state.activeTab === "reports") el.innerHTML = renderReportsTab();
      else el.innerHTML = renderDashboard();
    }

    function renderAll() {
      renderMonthSelector();
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.nav === state.activeTab));
      renderContent();
    }

    updateLockScreen();
    renderAll();
  </script>
</body>
</html>
