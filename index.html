<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#5c2d91" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="zoz Gold" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='26' fill='%235c2d91'/%3E%3Ctext x='64' y='79' font-family='Arial,sans-serif' font-size='44' font-weight='bold' text-anchor='middle' fill='white'%3EZZ%3C/text%3E%3C/svg%3E" />
  <title>zoz Gold - إدارة الخطوط والعملاء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --primary: #5c2d91;
      --primary-dark: #431d6e;
      --primary-light: #7b42bc;
      --primary-bg: #f3ebf9;
      --whatsapp: #16a34a;
      --whatsapp-bg: #dcfce7;
      --bg-body: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --warning: #f59e0b;
      --warning-dark: #b45309;
      --warning-bg: #fffbeb;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 18px rgba(92, 45, 145, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      overflow-x: hidden;
      padding-bottom: 84px;
    }

    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .w-full { width: 100%; }
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.35rem; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .text-muted { color: var(--text-muted); }
    .text-primary { color: var(--primary); }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }
    .text-warning { color: var(--warning-dark); }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mb-1 { margin-bottom: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 14px 16px 16px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .month-bar {
      background: rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-md);
      padding: 6px 10px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .month-select {
      background: transparent;
      color: #fff;
      border: none;
      font-weight: 800;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      padding: 4px;
      flex: 1;
      text-align: center;
    }

    .month-select option {
      color: var(--text-main);
      background: #fff;
    }

    .month-nav-btn {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .kpi-card {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      border-right: 4px solid var(--primary);
    }
    .kpi-card.success { border-right-color: var(--success); }
    .kpi-card.warning { border-right-color: var(--warning); }
    .kpi-card.danger { border-right-color: var(--danger); }

    /* Buttons & Badges */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warning { background: var(--warning); color: #1e293b; }
    .btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--text-main); }
    .btn-soft { background: var(--primary-bg); color: var(--primary); }
    .btn-sm { padding: 7px 11px; font-size: 0.8rem; border-radius: var(--radius-sm); }
    .btn-xs { padding: 5px 9px; font-size: 0.74rem; border-radius: 8px; }

    .btn-copy-pill {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      color: #334155;
      border: 1.5px solid #cbd5e1;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.74rem;
      font-weight: 800;
    }
    .btn-copy-pill:active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-wa {
      background: var(--whatsapp-bg);
      color: var(--whatsapp);
      border: 1.5px solid #86efac;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.74rem;
      font-weight: 800;
    }
    .btn-wa:active {
      background: var(--whatsapp);
      color: #fff;
    }

    .btn-invoice-pill {
      background: #fef3c7;
      color: #92400e;
      border: 1.5px solid #fcd34d;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.74rem;
      font-weight: 800;
    }
    .btn-invoice-pill:active {
      background: #d97706;
      color: #fff;
      border-color: #d97706;
    }

    .btn-edit-pkg {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge-primary { background: var(--primary-bg); color: var(--primary); }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-warning { background: var(--warning-bg); color: var(--warning-dark); }
    .badge-neutral { background: #f1f5f9; color: #475569; }

    /* Payment Dots */
    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .status-dot.paid { background-color: var(--success); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
    .status-dot.partial { background-color: var(--warning); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.22); }
    .status-dot.unpaid { background-color: var(--danger); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2); }

    /* Form Controls */
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }
    .input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      color: var(--text-main);
      background: #fff;
      outline: none;
    }
    .input:focus { border-color: var(--primary); }
    .input-sm { padding: 7px 10px; font-size: 0.84rem; border-radius: var(--radius-sm); }

    /* Progress & Distribution Slots */
    .progress-track {
      width: 100%;
      height: 9px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin: 7px 0 4px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 999px;
    }
    .progress-fill.over { background: var(--danger); }
    .progress-fill.full { background: var(--success); }

    .line-total-box {
      background: linear-gradient(135deg, #f3ebf9 0%, #ede9fe 100%);
      border: 1.5px solid var(--primary-light);
      padding: 5px 11px;
      border-radius: 12px;
      text-align: center;
    }

    .slot-item {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      margin-top: 8px;
      background: #fff;
    }
    .slot-item.empty {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      border-style: dashed;
      cursor: pointer;
    }
    .slot-item.empty:hover { border-color: var(--primary); background: var(--primary-bg); }

    .full-client-name {
      font-weight: 800;
      font-size: 0.93rem;
      color: var(--text-main);
      word-break: break-word;
      white-space: normal;
      line-height: 1.35;
    }

    /* Analytics Bars */
    .chart-row {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }
    .chart-bar-bg {
      height: 12px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 5px;
    }
    .chart-bar-profit { background: linear-gradient(90deg, #10b981, #059669); height: 100%; }
    .chart-bar-loss { background: linear-gradient(90deg, #ef4444, #dc2626); height: 100%; }
    .chart-bar-open { background: #94a3b8; height: 100%; }

    .filter-chip {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      cursor: pointer;
    }
    .filter-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 68px;
      z-index: 60;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.67rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 2px;
    }
    .nav-btn svg { width: 20px; height: 20px; stroke-width: 2.1; }
    .nav-btn.active { color: var(--primary); }

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      padding: 12px;
    }
    @media (min-width: 540px) { .modal-backdrop { align-items: center; } }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 460px;
      border-radius: 22px;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      z-index: 9999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Lock / Login Screen */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(155deg, #2d124d 0%, #5c2d91 55%, #7b42bc 100%);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .lock-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 26px;
      padding: 26px 22px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .lock-logo {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      font-weight: 900;
      font-size: 1.25rem;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(92, 45, 145, 0.3);
    }
    .btn-fingerprint {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      border: 1.5px solid #334155;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 800;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-fingerprint:active { transform: scale(0.97); }

    /* Invoice Preview Styling */
    .invoice-preview-box {
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 18px;
      color: #1e293b;
      direction: rtl;
      text-align: right;
    }
    .invoice-brand-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .invoice-meta-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 0.85rem;
    }
    .invoice-summary-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- LOCK / LOGIN SCREEN -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-logo">zoz Gold</div>
      <h1 class="text-lg font-extrabold">zoz Gold</h1>
      <p class="text-xs text-muted mb-3">إدارة الباقات والخطوط • محمي بكلمة مرور وبصمة</p>

      <div id="login-error-box" class="hidden text-xs font-bold text-danger mb-2" style="background:var(--danger-bg); padding:8px; border-radius:10px;"></div>

      <form onsubmit="handlePasswordLogin(event)" style="text-align:right;">
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input type="text" id="login-username" class="input" placeholder="أدخل اسم المستخدم" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" id="login-password" class="input" placeholder="••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary w-full" style="padding:12px; font-size:0.95rem;">
          🔓 دخول بالرقم السري
        </button>
      </form>

      <button type="button" onclick="loginWithFingerprint()" class="btn-fingerprint">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.1">
          <path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/>
        </svg>
        <span>تسجيل / الدخول بالبصمة 👆</span>
      </button>

      <div id="fingerprint-hint" class="text-xs text-muted mt-2">
        الافتراضي: <strong>admin</strong> / <strong>1234</strong>
      </div>
    </div>
  </div>

  <!-- APP HEADER -->
  <header class="app-header">
    <div class="flex items-center justify-between gap-2">
      <div>
        <div class="flex items-center gap-2">
          <span style="background:#fff;color:var(--primary);font-weight:900;padding:2px 9px;border-radius:8px;font-size:0.85rem;">zoz Gold</span>
          <span class="font-extrabold text-base">zoz Gold</span>
        </div>
        <div class="text-xs" style="opacity:0.92;margin-top:2px;" id="header-status-label">يعمل أوفلاين بالكامل</div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="openAddMonthModal()" class="btn btn-xs" style="background:rgba(255,255,255,0.22);color:#fff;border:1px solid rgba(255,255,255,0.35);">
          + شهر
        </button>
        <button onclick="lockApp()" class="btn btn-xs" style="background:rgba(239,68,68,0.88);color:#fff;border:1px solid rgba(255,255,255,0.3);" title="قفل التطبيق">
          🔒 قفل
        </button>
      </div>
    </div>

    <div class="month-bar">
      <button class="month-nav-btn" onclick="stepMonth(-1)" title="الشهر السابق">&#9654;</button>
      <select id="month-selector" class="month-select" onchange="selectMonth(this.value)"></select>
      <button class="month-nav-btn" onclick="stepMonth(1)" title="الشهر التالي">&#9664;</button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="app-content" class="container"></main>

  <!-- BOTTOM NAVIGATION (5 TABS) -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>الرئيسية</span>
    </button>
    <button class="nav-btn" data-tab="distribution" onclick="switchTab('distribution')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      <span>التوزيع</span>
    </button>
    <button class="nav-btn" data-tab="smart" onclick="switchTab('smart')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>اقتراح الذكاء</span>
    </button>
    <button class="nav-btn" data-tab="payments" onclick="switchTab('payments')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span>الدفع</span>

       ========================================================================== */
    function bufferToBase64Url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function base64UrlToBuffer(base64url) {
      const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      const pad = base64.length % 4 ? '='.repeat(4 - (base64.length % 4)) : '';
      const binary = atob(base64 + pad);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    async function registerFingerprintForDevice() {
      if (!window.PublicKeyCredential || !navigator.credentials || !navigator.credentials.create) {
        showToast('متصفحك لا يدعم مستشعر البصمة حالياً');
        return;
      }
      try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);
        const userId = new Uint8Array(16);
        window.crypto.getRandomValues(userId);

        const credential = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: 'zoz Gold' },
            user: {
              id: userId,
              name: appState.auth.username || 'admin',
              displayName: appState.auth.username || 'Admin'
            },
            pubKeyCredParams: [
              { type: 'public-key', alg: -7 },
              { type: 'public-key', alg: -257 }
            ],
            authenticatorSelection: {
              authenticatorAttachment: 'platform',
              userVerification: 'required'
            },
            timeout: 60000
          }
        });

        if (credential && credential.rawId) {
          appState.auth.credentialId = bufferToBase64Url(credential.rawId);
          appState.auth.biometricEnabled = true;
          saveState();
          renderAll();
          showToast('تم تفعيل وربط البصمة بهذا الجهاز بنجاح! 👆');
        }
      } catch (err) {
        showToast('تعذر تفعيل البصمة (تأكد من استخدام متصفح كروم على الهاتف)');
      }
    }

    async function loginWithFingerprint() {
      const errBox = document.getElementById('login-error-box');
      if (!window.PublicKeyCredential || !navigator.credentials || !navigator.credentials.get) {
        errBox.textContent = 'البصمة غير مدعومة في المعاين المباشر — استخدم الرقم السري.';
        errBox.classList.remove('hidden');
        return;
      }

      try {
        if (!appState.auth.biometricEnabled || !appState.auth.credentialId) {
          await registerFingerprintForDevice();
          if (appState.auth.biometricEnabled) {
            unlockApp();
          } else {
            errBox.textContent = 'يرجى الدخول بالرقم السري أولاً وتفعيل البصمة من الإعدادات.';
            errBox.classList.remove('hidden');
          }
          return;
        }

        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge,
            allowCredentials: [{
              id: base64UrlToBuffer(appState.auth.credentialId),
              type: 'public-key'
            }],
            userVerification: 'required',
            timeout: 60000
          }
        });

        if (assertion) {
          unlockApp();
          showToast('تم التحقق من البصمة بنجاح 👆');
        }
      } catch (err) {
        errBox.textContent = 'لم يتم التحقق من البصمة أو تطلب إدخال الرقم السري.';
        errBox.classList.remove('hidden');
      }
    }

    function getPackagePrice(gb) {
      const pkg = appState.packages.find(p => Number(p.gb) === Number(gb));
      return pkg ? Number(pkg.price) : 0;
    }

    function getCustomerPaymentInfo(monthRecord, customer) {
      const due = getPackagePrice(customer.gb);
      if (!monthRecord.paidAmounts) monthRecord.paidAmounts = {};

      let paid = 0;
      if (monthRecord.paidAmounts[customer.id] !== undefined) {
        paid = Number(monthRecord.paidAmounts[customer.id]) || 0;
      } else if (monthRecord.payments && monthRecord.payments[customer.id]) {
        paid = due;
      }

      const remaining = Math.max(0, due - paid);
      let status = 'unpaid';
      if (due > 0 && paid >= due) status = 'paid';
      else if (paid > 0 && paid < due) status = 'partial';

      return { status, paid, due, remaining };
    }

    function getCustomerAssignedLineName(monthRecord, customerId) {
      const dist = monthRecord.distributions || {};
      for (const line of appState.lines) {
        const slots = dist[line.id] || [];
        if (slots.includes(customerId)) return line.name;
      }
      if (monthRecord.merchantAssigned && monthRecord.merchantAssigned[customerId]) {
        return 'تحويل للتاجر';
      }
      return 'غير مسكن';
    }

      } catch (err) {
        showToast(`الرقم: ${cleanPhone}`);

      document.body.removeChild(textArea);
    }

      const notesMatch = String(customer.notes || '').match(/01[0125]\d{8}/);
      const rawPhone = notesMatch ? notesMatch[0] : String(customer.phone || '').replace(/\D/g, '');
      if (!rawPhone) return '';
      if (rawPhone.startsWith('20')) return rawPhone;
      return rawPhone.startsWith('0') ? '2' + rawPhone : rawPhone;
    }

      const price = getPackagePrice(customer.gb);

      }
      return msg;
    }

    function sendInvoiceNoteWhatsApp(customerId) {

      if (!customer) return;

        showToast('لا يوجد رقم واتساب صالح لهذا العميل');
        return;
      }
      const mRec = appState.months[appState.activeMonthId];
      const pInfo = getCustomerPaymentInfo(mRec, customer);
      const lineName = getCustomerAssignedLineName(mRec, customer.id);
      const firstName = String(customer.name || '').trim().split(/\s+/)[0] || customer.name;
      const text = `اهلا بيك يا ا / ${firstName}
فاتورة (${formatMonthLabel(appState.activeMonthId)}) - zoz Gold
الباقة: ${customer.gb} جيجا (${pInfo.due} ج.م)
الخط: ${lineName}
المدفوع: ${pInfo.paid} ج.م | المتبقي: ${pInfo.remaining} ج.م`;

    const ICON_COPY = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const ICON_WA = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`;
    const ICON_EDIT = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

    /* ==========================================================================
       3. MONTH METRICS & CALCULATION ENGINE
       ========================================================================== */
    function getSortedMonthIds() {
      return Object.keys(appState.months).sort();
    }

    function ensureMonthSlots(monthRecord) {
      if (!monthRecord.merchantAssigned) monthRecord.merchantAssigned = {};
      if (!monthRecord.merchantPaid) monthRecord.merchantPaid = {};
      appState.lines.forEach(line => {
        if (!Array.isArray(monthRecord.distributions[line.id])) {
          monthRecord.distributions[line.id] = Array(line.maxSlots).fill(null);
        } else {
          const cur = monthRecord.distributions[line.id];
          if (cur.length < line.maxSlots) {
            monthRecord.distributions[line.id] = [...cur, ...Array(line.maxSlots - cur.length).fill(null)];
          } else if (cur.length > line.maxSlots) {
            monthRecord.distributions[line.id] = cur.slice(0, line.maxSlots);
          }
        }
      });
    }

    function getMonthMetrics(monthId) {
      const mRec = appState.months[monthId];
      if (!mRec) return null;

      if (mRec.isArchived && mRec.snapshot) {
        const safeDealerDiff = Number(mRec.snapshot.totalDealerDiff ?? mRec.snapshot.dealerProfit ?? 0) || 0;
        const safeLinesSales = Number(mRec.snapshot.totalLinesSales || 0) || 0;
        const safeLinesCost = Number(mRec.snapshot.totalLinesCost || 0) || 0;
        const safeNetProfit = Number(mRec.snapshot.netProfit ?? (safeLinesSales + safeDealerDiff - safeLinesCost)) || 0;
        return {
          ...mRec.snapshot,
          monthId,
          isArchived: true,
          totalLinesSales: safeLinesSales,
          totalLinesCost: safeLinesCost,
          totalDealerDiff: safeDealerDiff,
          netProfit: safeNetProfit,
          notes: mRec.notes || ''
        };
      }

      ensureMonthSlots(mRec);
      const activeCustomers = appState.customers.filter(c => c.active);
      const assignedIds = new Set();

      const lineDetails = appState.lines.map(line => {
        const slots = mRec.distributions[line.id] || [];
        let usedGb = 0;
        let lineSales = 0;
        let filledCount = 0;

        const resolvedSlots = slots.map((custId, idx) => {
          if (!custId) return { index: idx, customer: null, gb: 0, price: 0 };
          const cust = activeCustomers.find(c => c.id === custId);
          if (!cust) return { index: idx, customer: null, gb: 0, price: 0 };

          assignedIds.add(cust.id);
          const price = getPackagePrice(cust.gb);
          usedGb += Number(cust.gb);
          lineSales += price;
          filledCount++;
          return { index: idx, customer: cust, gb: Number(cust.gb), price };
        });

        return {
          ...line,
          slots: resolvedSlots,
          usedGb,
          remainingGb: Number(line.capacityGb) - usedGb,
          lineSales,
          filledCount
        };
      });

      const unassignedCustomers = activeCustomers
        .filter(c => !assignedIds.has(c.id))
        .map(c => {
          const clientPrice = getPackagePrice(c.gb);
          const isSentToDealer = Boolean(mRec.merchantAssigned[c.id]) || (Number(mRec.merchantPaid[c.id]) > 0);
          const dealerPrice = mRec.merchantPaid[c.id] !== undefined ? Number(mRec.merchantPaid[c.id]) : clientPrice;
          const diff = isSentToDealer ? (clientPrice - dealerPrice) : 0;
          return { customer: c, gb: Number(c.gb), clientPrice, isSentToDealer, dealerPrice, diff };
        });

      const dealerCustomers = unassignedCustomers.filter(i => i.isSentToDealer);
      const waitingCustomers = unassignedCustomers.filter(i => !i.isSentToDealer);

      const totalLinesSales = lineDetails.reduce((acc, l) => acc + l.lineSales, 0);
      const totalLinesCost = lineDetails.reduce((acc, l) => acc + Number(l.monthlyCost), 0);
      const totalDealerDiff = dealerCustomers.reduce((acc, d) => acc + d.diff, 0);
      const topUp = Number(mRec.topUp || 0);
      const netProfit = totalLinesSales + totalDealerDiff + topUp - totalLinesCost;

      let paidCustomersCount = 0;
      let unpaidCustomersCount = 0;
      let totalCollectedAmount = 0;
      let totalBilledAmount = 0;

      activeCustomers.forEach(c => {
        const pInfo = getCustomerPaymentInfo(mRec, c);
        totalBilledAmount += pInfo.due;
        totalCollectedAmount += pInfo.paid;
        if (pInfo.status === 'paid') paidCustomersCount++;
        else unpaidCustomersCount++;
      });

      return {
        monthId,
        isArchived: false,
        activeCustomers,
        lineDetails,
        unassignedCustomers,
        dealerCustomers,
        waitingCustomers,
        totalLinesSales,
        totalLinesCost,
        totalDealerDiff,
        topUp,
        netProfit,
        paidCustomersCount,
        unpaidCustomersCount,
        totalCollectedAmount,
        totalBilledAmount,
        totalRemainingDebt: Math.max(0, totalBilledAmount - totalCollectedAmount),
        notes: mRec.notes || ''
      };
    }

    function selectMonth(monthId) {
      if (!appState.months[monthId]) {
        appState.months[monthId] = createEmptyMonthRecord(monthId);
      }
      appState.activeMonthId = monthId;
      saveState();
      renderAll();
    }

    function stepMonth(delta) {
      const ids = getSortedMonthIds();
      const idx = ids.indexOf(appState.activeMonthId);
      if (idx + delta >= 0 && idx + delta < ids.length) {
        selectMonth(ids[idx + delta]);
      } else {
        const [y, m] = appState.activeMonthId.split('-').map(Number);
        let newM = m + delta;
        let newY = y;
        if (newM > 12) { newM = 1; newY++; }
        if (newM < 1) { newM = 12; newY--; }
        const nextId = formatMonthId(newY, newM);
        selectMonth(nextId);
        showToast(`تم فتح شهر ${formatMonthLabel(nextId)}`);
      }
    }

    function openAddMonthModal() {
      let yearOptions = '';
      for (let y = 2025; y <= 2035; y++) {
        yearOptions += `<option value="${y}" ${y === 2026 ? 'selected' : ''}>${y}</option>`;
      }
      let monthOptions = ARABIC_MONTHS.map((name, i) => `<option value="${i + 1}">${name}</option>`).join('');

      openModal(`
        <h3 class="text-lg font-extrabold mb-3">فتح / إضافة شهر جديد</h3>
        <div class="flex gap-2 mb-3">
          <div class="w-full">
            <label class="form-label">الشهر</label>
            <select id="new-month-num" class="input">${monthOptions}</select>
          </div>
          <div class="w-full">
            <label class="form-label">السنة</label>
            <select id="new-month-year" class="input">${yearOptions}</select>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="confirmAddMonth()" class="btn btn-primary w-full">فتح الشهر</button>
          <button onclick="closeModal()" class="btn btn-outline">إلغاء</button>
        </div>
      `);
    }

    function confirmAddMonth() {
      const m = Number(document.getElementById('new-month-num').value);
      const y = Number(document.getElementById('new-month-year').value);
      const id = formatMonthId(y, m);
      closeModal();
      selectMonth(id);
      showToast(`تم الانتقال إلى ${formatMonthLabel(id)}`);
    }

    /* ==========================================================================
       4. NAVIGATION & HEADER RENDER
       ========================================================================== */
    function renderHeader() {
      const sel = document.getElementById('month-selector');
      const ids = getSortedMonthIds();
      sel.innerHTML = ids.map(id => {
        const m = appState.months[id];
        return `<option value="${id}" ${id === appState.activeMonthId ? 'selected' : ''}>${formatMonthLabel(id)}${m.isArchived ? ' 🔒' : ''}</option>`;
      }).join('');

      const activeM = appState.months[appState.activeMonthId];
      const statusEl = document.getElementById('header-status-label');
      statusEl.innerHTML = activeM.isArchived
        ? `🔒 شهر مقفول ومؤرشف (محمي من التعديل)`
        : `🟢 شهر مفتوح • ${appState.customers.length} عميل مسجل`;
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
      });
      renderContent();
    }

    function renderAll() {
      renderHeader();
      renderContent();
    }

    function renderContent() {
      const container = document.getElementById('app-content');
      const metrics = getMonthMetrics(appState.activeMonthId);

      if (currentTab === 'dashboard') container.innerHTML = renderDashboard(metrics);
      else if (currentTab === 'distribution') container.innerHTML = renderDistribution(metrics);
      else if (currentTab === 'smart') container.innerHTML = renderSmartOptimizer(metrics);
      else if (currentTab === 'payments') container.innerHTML = renderPayments(metrics);
      else if (currentTab === 'manage') container.innerHTML = renderClientsAndStats(metrics);
    }

    /* ==========================================================================
       5. TAB 1: DASHBOARD (الرئيسية)
       ========================================================================== */
    function renderDashboard(metrics) {
      const linesOverviewHtml = (metrics.lineDetails || []).map(line => {
        const pct = line.capacityGb > 0 ? Math.min(100, Math.round((line.usedGb / line.capacityGb) * 100)) : 0;
        const isOver = line.remainingGb < 0;
        return `
          <div style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border);">
            <div class="flex items-center justify-between">
              <div>
                <span class="font-extrabold text-sm">${line.name}</span>
                <span class="badge badge-primary" style="margin-right:6px;">${line.filledCount}/${line.maxSlots} مشترك</span>
              </div>
              <span class="text-xs font-extrabold ${isOver ? 'text-danger' : 'text-success'}">
                ${isOver ? `تجاوز بـ ${Math.abs(line.remainingGb)} جيجا` : `متبقي ${line.remainingGb} جيجا`}
              </span>
            </div>
            <div class="progress-track">
              <div class="progress-fill ${isOver ? 'over' : (pct >= 95 ? 'full' : '')}" style="width:${pct}%;"></div>
            </div>
            <div class="flex justify-between text-xs text-muted">
              <span>السعة: <strong>${line.usedGb}</strong> / ${line.capacityGb} جيجا</span>
              <span>تحصيل الخط: <strong class="text-primary">${line.lineSales.toLocaleString()} ج.م</strong></span>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="text-xs text-muted font-bold">إجمالي المبيعات</div>
            <div class="text-xl font-extrabold text-primary mt-1">${metrics.totalLinesSales.toLocaleString()} <span class="text-xs">ج.م</span></div>
            <div class="text-xs text-muted mt-1">فرق التاجر: <strong>${metrics.totalDealerDiff >= 0 ? '+' : ''}${metrics.totalDealerDiff} ج.م</strong></div>
          </div>

          <div class="kpi-card danger">
            <div class="text-xs text-muted font-bold">إجمالي التكلفة</div>
            <div class="text-xl font-extrabold text-danger mt-1">${metrics.totalLinesCost.toLocaleString()} <span class="text-xs">ج.م</span></div>
            <div class="text-xs text-muted mt-1">${appState.lines.length} خطوط رئيسية</div>
          </div>

          <div class="kpi-card warning">
            <div class="text-xs text-muted font-bold">المتبقي تحصيله</div>
            <div class="text-xl font-extrabold text-warning mt-1">${(metrics.totalRemainingDebt || 0).toLocaleString()} <span class="text-xs">ج.م</span></div>
            <div class="text-xs text-muted mt-1">المحصّل: ${(metrics.totalCollectedAmount || 0).toLocaleString()} ج.م</div>
          </div>

          <div class="kpi-card ${metrics.unpaidCustomersCount > 0 ? 'danger' : 'success'}">
            <div class="text-xs text-muted font-bold">غير المسددين</div>
            <div class="text-xl font-extrabold ${metrics.unpaidCustomersCount > 0 ? 'text-danger' : 'text-success'} mt-1">
              ${metrics.unpaidCustomersCount || 0} <span class="text-xs">عميل</span>
            </div>
            <div class="text-xs text-muted mt-1">مسدد بالكامل: ${metrics.paidCustomersCount || 0}</div>
          </div>
        </div>

        <div class="card">
          <div class="text-sm font-extrabold mb-2">وصول سريع</div>
          <div class="flex gap-2">
            <button onclick="switchTab('distribution')" class="btn btn-primary w-full btn-sm">تسكين الخطوط</button>
            <button onclick="switchTab('payments')" class="btn btn-soft w-full btn-sm">تحصيل الدفع</button>
            <button onclick="switchTab('smart')" class="btn btn-outline w-full btn-sm">اقتراح الذكاء</button>
          </div>
        </div>

        <div class="card">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-extrabold">ملخص سعة الخطوط</h2>
            ${!metrics.isArchived ? `<button onclick="openLineModal()" class="btn btn-soft btn-xs">+ خط جديد</button>` : ''}
          </div>
          ${linesOverviewHtml || '<p class="text-xs text-muted">شهر مؤرشف — راجع التفاصيل في تبويب الإحصائيات.</p>'}
        </div>
      `;
    }

    /* ==========================================================================
       6. TAB 2: DISTRIBUTION (التوزيع والخطوط + الفاتورة + واتساب + التاجر)
       ========================================================================== */
    function renderDistribution(metrics) {
      const mRec = appState.months[appState.activeMonthId];

      const linesCardsHtml = (metrics.lineDetails || []).map(line => {
        const isOver = line.remainingGb < 0;
        const safeLineName = (line.name || '').replace(/'/g, "\\'");
        const slotsHtml = line.slots.map(slot => {
          if (!slot.customer) {

              <div class="slot-item empty" onclick="${metrics.isArchived ? '' : `openSlotPicker('${line.id}', ${slot.index})`}">

                  <span class="text-xs text-muted font-bold">خانة فارغة — اضغط لإضافة عميل</span>

              </div>

          }

          const c = slot.customer;

                    <button type="button" onclick="openQuickPackageModal('${c.id}')" class="btn-edit-pkg" title="تعديل الباقة">${ICON_EDIT} تعديل</button>

                  <button type="button" onclick="openCustomerInvoiceModal('${c.id}', '${safeLineName}')" class="btn btn-invoice-pill">📄 فاتورة</button>
                  ${!metrics.isArchived ? `<button type="button" onclick="removeFromSlot('${line.id}', ${slot.index})" class="btn btn-danger btn-xs">×</button>` : ''}
                </div>
              </div>
              ${pInfo.status === 'partial' ? `<div class="text-xs text-warning font-bold">مدفوع ${pInfo.paid} ج.م • متبقي ${pInfo.remaining} ج.م</div>` : ''}
            </div>
          `;
        }).join('');

        return `
          <div class="card" style="${isOver ? 'border:2px solid var(--danger);' : ''}">
            <div class="flex items-center justify-between gap-2 mb-2 flex-wrap">
              <div>
                <h3 class="text-base font-extrabold">${line.name}</h3>
                <div class="text-xs text-muted">المستخدم: <strong>${line.usedGb}/${line.capacityGb} جيجا</strong> • (${line.filledCount}/${line.maxSlots})</div>

                <div style="font-size:0.96rem; color:var(--primary-dark); font-weight:900;">${line.lineSales.toLocaleString()} ج.م</div>
              </div>

                  ${isOver ? `تجاوز ${Math.abs(line.remainingGb)} جيجا` : `متبقي ${line.remainingGb} جيجا`}
                </span>
              </div>
            </div>
            ${slotsHtml}
          </div>
        `;
      }).join('');

      const dealerHtml = (metrics.dealerCustomers || []).length === 0
        ? `<p class="text-xs text-muted text-center py-2">لا يوجد عملاء محولون للتاجر حالياً.</p>`
        : metrics.dealerCustomers.map(item => {
            const c = item.customer;
            const pInfo = getCustomerPaymentInfo(mRec, c);
            const safePhone = (c.phone || '').replace(/'/g, "\\'");
            const safeName = (c.name || '').replace(/'/g, "\\'");
            const isPos = item.diff >= 0;

            return `
              <div style="padding:11px; border:1.5px solid ${isPos ? '#86efac' : '#fca5a5'}; border-radius:12px; margin-top:8px; background:#fff;">

      return `

    /* ==========================================================================
       7. TAB 3: SMART OPTIMIZER (اقتراح الذكاء لأعلى عائد مالي)
       ========================================================================== */
    function findHighestRevenueCombo(pool, capacityGb, maxSlots) {
      const items = pool
        .map(c => ({ customer: c, gb: Number(c.gb), price: getPackagePrice(c.gb) }))
        .filter(item => item.gb > 0 && item.gb <= capacityGb)
        .sort((a, b) => (b.price / b.gb) - (a.price / a.gb) || b.price - a.price);

      let bestRevenue = 0;
      let bestGb = 0;
      let bestCombo = [];

      function backtrack(startIdx, currentCombo, currentGb, currentRev) {
        if (currentRev > bestRevenue || (currentRev === bestRevenue && currentGb > bestGb)) {
          bestRevenue = currentRev;
          bestGb = currentGb;
          bestCombo = [...currentCombo];
        }
        if (currentCombo.length === maxSlots || startIdx >= items.length) return;

        for (let i = startIdx; i < items.length; i++) {
          const item = items[i];
          if (currentGb + item.gb <= capacityGb) {
            currentCombo.push(item);
            backtrack(i + 1, currentCombo, currentGb + item.gb, currentRev + item.price);
            currentCombo.pop();
          }
        }
      }

      backtrack(0, [], 0, 0);
      return { combo: bestCombo, totalGb: bestGb, totalRevenue: bestRevenue };
    }

    function computeSmartSuggestions(metrics) {
      const mRec = appState.months[appState.activeMonthId];
      let availablePool = smartScope === 'unassigned'
        ? (metrics.unassignedCustomers || []).map(e => e.customer)
        : [...(metrics.activeCustomers || [])];

      return appState.lines.map(line => {
        const currentSlots = mRec.distributions[line.id] || Array(line.maxSlots).fill(null);
        let lockedCustomers = [];
        let emptySlotCount = line.maxSlots;
        let lockedGb = 0;
        let lockedRev = 0;

        if (smartScope === 'unassigned') {
          currentSlots.forEach(cid => {
            if (cid) {
              const found = (metrics.activeCustomers || []).find(c => c.id === cid);
              if (found) {
                lockedCustomers.push({ customer: found, gb: Number(found.gb), price: getPackagePrice(found.gb) });
                lockedGb += Number(found.gb);
                lockedRev += getPackagePrice(found.gb);
              }
            }
          });
          emptySlotCount = Math.max(0, line.maxSlots - lockedCustomers.length);
        }

        const remainingCap = Math.max(0, Number(line.capacityGb) - lockedGb);
        const result = (emptySlotCount > 0 && remainingCap > 0)
          ? findHighestRevenueCombo(availablePool, remainingCap, emptySlotCount)
          : { combo: [], totalGb: 0, totalRevenue: 0 };

        const chosenIds = new Set(result.combo.map(x => x.customer.id));
        availablePool = availablePool.filter(c => !chosenIds.has(c.id));

        return {
          line,
          lockedCount: lockedCustomers.length,
          newSuggestions: result.combo,
          combinedList: [...lockedCustomers, ...result.combo],
          finalGb: lockedGb + result.totalGb,
          finalRev: lockedRev + result.totalRevenue
        };
      });
    }

    function renderSmartOptimizer(metrics) {
      const suggestions = computeSmartSuggestions(metrics);

      const cardsHtml = suggestions.map(s => {
        const listHtml = s.combinedList.length === 0
          ? `<div class="text-xs text-muted text-center py-2">لا يوجد عملاء متاحون يناسبون السعة المتبقية.</div>`
          : s.combinedList.map((item, idx) => `

                  <span class="font-bold">${item.customer.name}</span>
                </div>
                <div><strong>${item.gb} جيجا</strong> • <strong class="text-primary">${item.price} ج.م</strong></div>
              </div>
            `).join('');

        return `

                <h3 class="text-base font-extrabold">${s.line.name} (${s.line.capacityGb} جيجا)</h3>

              </div>
              <div class="line-total-box">
                <div style="font-size:0.68rem; color:var(--primary); font-weight:700;">أعلى عائد</div>
                <div style="font-size:0.96rem; color:var(--primary-dark); font-weight:900;">${s.finalRev.toLocaleString()} ج.م</div>
              </div>
            </div>
            <div class="mb-3">${listHtml}</div>
            ${!metrics.isArchived && s.newSuggestions.length > 0 ? `

                ✔ تطبيق المقترح على ${s.line.name}

            ` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="card" style="background:linear-gradient(135deg, #f3ebf9 0%, #fff 100%);">
          <h2 class="text-base font-extrabold text-primary mb-1">⭐ التوزيع الذكي لأعلى عائد مالي</h2>
          <p class="text-xs text-muted mb-3">يختار أقوى توليفة (بحد أقصى 6 مشتركين وفي حدود جيجات الخط) تحقق أعلى ربح ممكن.</p>
          <div class="flex gap-2">
            <button onclick="smartScope='unassigned'; renderContent();" class="filter-chip w-full ${smartScope === 'unassigned' ? 'active' : ''}">إكمال الخانات الفارغة</button>
            <button onclick="smartScope='all'; renderContent();" class="filter-chip w-full ${smartScope === 'all' ? 'active' : ''}">إعادة توزيع الكل</button>
          </div>
        </div>
        ${cardsHtml}
      `;
    }

    function applySmartSuggestionToLine(lineId) {
      const mRec = appState.months[appState.activeMonthId];
      if (mRec.isArchived) return;
      const metrics = getMonthMetrics(appState.activeMonthId);
      const target = computeSmartSuggestions(metrics).find(s => s.line.id === lineId);
      if (!target) return;

      const newSlots = Array(target.line.maxSlots).fill(null);
      target.combinedList.forEach((item, idx) => {
        if (idx < newSlots.length) {
          newSlots[idx] = item.customer.id;
          delete mRec.merchantAssigned[item.customer.id];
        }
      });
      mRec.distributions[lineId] = newSlots;
      saveState();
      switchTab('distribution');
      showToast(`تم تطبيق المقترح الذكي على ${target.line.name}`);
    }

    function renderClientsAndStats(metrics) {

            </button>

              👥 العملاء والخطوط (${appState.customers.length})
            </button>
          </div>
        </div>
      `;

      return switcherHtml + (manageSubView === 'stats' ? renderStatsSection(metrics) : renderCustomersSection());
    }

    function renderStatsSection(metrics) {
      const sortedIds = getSortedMonthIds();
      const allMetrics = sortedIds.map(id => getMonthMetrics(id));
      const archivedMetrics = allMetrics.filter(m => m.isArchived);

      const totalArchivedProfit = archivedMetrics.reduce((acc, m) => acc + (Number(m.netProfit) || 0), 0);
      const maxAbsProfit = Math.max(1, ...allMetrics.map(m => Math.abs(Number(m.netProfit) || 0)));

      const monthsListHtml = allMetrics.map(m => {
        const isLocked = Boolean(m.isArchived);
        const profit = Number(m.netProfit) || 0;
        const dealerDiff = Number(m.totalDealerDiff) || 0;
        const sales = Number(m.totalLinesSales) || 0;
        const cost = Number(m.totalLinesCost) || 0;
        const widthPct = Math.min(100, Math.round((Math.abs(profit) / maxAbsProfit) * 100));

        const badgeHtml = isLocked
          ? `<span class="badge ${profit >= 0 ? 'badge-success' : 'badge-danger'}">${profit >= 0 ? '+' : ''}${profit.toLocaleString()} ج.م 🔒</span>`
          : `<span class="badge badge-neutral">مفتوح / غير مقفول</span>`;

        const barClass = !isLocked ? 'chart-bar-open' : (profit >= 0 ? 'chart-bar-profit' : 'chart-bar-loss');

        return `
          <div class="chart-row" onclick="selectMonth('${m.monthId}')" style="cursor:pointer;">
            <div class="flex justify-between items-center text-xs font-bold gap-2">
              <span>${formatMonthLabel(m.monthId)}</span>
              ${badgeHtml}
            </div>
            <div class="chart-bar-bg">
              <div class="${barClass}" style="width:${isLocked ? Math.max(8, widthPct) : 25}%;"></div>
            </div>
            <div class="flex justify-between text-xs text-muted mt-1">
              <span>الخطوط: ${sales}</span>
              <span>التاجر: ${dealerDiff >= 0 ? '+' : ''}${dealerDiff}</span>
              <span>التكلفة: ${cost}</span>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="card" style="border-right:4px solid var(--success); background:linear-gradient(135deg, #ecfdf5 0%, #ffffff 100%);">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div>
              <div class="text-xs font-bold text-muted">إجمالي الأرباح المؤرشفة (الشهور المقفولة 🔒 فقط)</div>
              <div class="text-xl font-extrabold text-success mt-1">
                ${totalArchivedProfit >= 0 ? '+' : ''}${totalArchivedProfit.toLocaleString()} <span class="text-xs">ج.م</span>
              </div>
            </div>
            <span class="badge badge-success">${archivedMetrics.length} شهر مقفول</span>
          </div>
        </div>

        <div class="card">
          <h3 class="text-base font-extrabold mb-2">سجل أرباح الشهور</h3>

        </div>

          <div class="flex items-center justify-between mb-2">
            <h3 class="text-base font-extrabold">ملخص ${formatMonthLabel(appState.activeMonthId)}</h3>
            <span class="badge ${metrics.isArchived ? 'badge-warning' : 'badge-neutral'}">
              ${metrics.isArchived ? '🔒 مقفول ومؤرشف' : 'مفتوح'}
            </span>
          </div>

          <div style="background:#f8fafc; padding:12px; border-radius:12px; font-size:0.85rem; margin-bottom:12px;">
            <div class="flex justify-between mb-1"><span>إجمالي مبيعات الخطوط:</span><strong>${metrics.totalLinesSales} ج.م</strong></div>
            <div class="flex justify-between mb-1">
              <span>صافي فرق التاجر:</span>
              <strong class="${metrics.totalDealerDiff >= 0 ? 'text-success' : 'text-danger'}">
                ${metrics.totalDealerDiff >= 0 ? '+' : ''}${metrics.totalDealerDiff} ج.م
              </strong>
            </div>
            <div class="flex justify-between mb-2"><span>إجمالي تكلفة الخطوط:</span><strong class="text-danger">- ${metrics.totalLinesCost} ج.م</strong></div>
            <div class="flex justify-between" style="border-top:1px dashed var(--border); padding-top:8px; font-size:0.98rem;">
              <span class="font-extrabold">صافي ربح الشهر:</span>
              <strong class="${metrics.netProfit >= 0 ? 'text-success' : 'text-danger'}">${metrics.netProfit} ج.م</strong>
            </div>
          </div>

          ${!metrics.isArchived ? `
            <button onclick="archiveCurrentMonth()" class="btn btn-primary w-full">
              🔒 إقفال وأرشفة الشهر
            </button>
          ` : `
            <button onclick="unarchiveCurrentMonth()" class="btn btn-warning w-full">
              🔓 فك القفل وإعادة فتح الشهر
            </button>
          `}
        </div>

        <div class="card">
          <h3 class="text-base font-extrabold mb-2">💾 النسخ الاحتياطي السريع عبر واتساب</h3>
          <button onclick="sendWhatsAppBackup()" class="btn btn-success w-full btn-sm mb-2">
            📤 إرسال نسخة احتياطية لنفسي عبر واتساب
          </button>
          <button onclick="openPasteBackupModal()" class="btn btn-outline w-full btn-sm">
            📋 استعادة البيانات من كود واتساب
          </button>
        </div>

        <div class="card" style="border-right:4px solid var(--primary);">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-base font-extrabold">🔐 الأمان وكلمة المرور والبصمة</h3>
            <span class="badge ${appState.auth.biometricEnabled ? 'badge-success' : 'badge-neutral'}">
              ${appState.auth.biometricEnabled ? '👆 البصمة مفعلة' : 'البصمة غير مفعلة'}
            </span>
          </div>

          <div class="flex gap-2 mb-2">
            <button onclick="openChangeCredentialsModal()" class="btn btn-soft w-full btn-sm">
              🔑 تغيير اليوزرنيم والباسورد
            </button>
            <button onclick="registerFingerprintForDevice()" class="btn btn-primary w-full btn-sm">
              👆 تفعيل البصمة لهذا الجهاز
            </button>
          </div>
          <p class="text-xs text-muted">
            ملاحظة: البصمة تعمل مباشرة عند فتح التطبيق عبر متصفح الهاتف (Chrome/Safari) أو بعد تحويله لتطبيق.
          </p>
        </div>
      `;
    }

    function openChangeCredentialsModal() {
      openModal(`
        <h3 class="text-base font-extrabold mb-3">تغيير بيانات تسجيل الدخول</h3>
        <div class="form-group">
          <label class="form-label">اسم المستخدم الجديد</label>
          <input type="text" id="edit-auth-user" class="input" value="${appState.auth.username}" />
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور الجديدة</label>
          <input type="text" id="edit-auth-pass" class="input" value="${appState.auth.password}" />
        </div>
        <div class="flex gap-2">
          <button onclick="saveNewCredentials()" class="btn btn-primary w-full">حفظ البيانات</button>
          <button onclick="closeModal()" class="btn btn-outline">إلغاء</button>
        </div>
      `);
    }

    function saveNewCredentials() {
      const newUser = document.getElementById('edit-auth-user').value.trim();
      const newPass = document.getElementById('edit-auth-pass').value.trim();
      if (!newUser || !newPass) {
        showToast('أدخل اسم المستخدم وكلمة المرور');
        return;
      }
      appState.auth.username = newUser;
      appState.auth.password = newPass;
      saveState();
      closeModal();
      showToast('تم تحديث اسم المستخدم وكلمة المرور بنجاح');
    }

    function archiveCurrentMonth() {
      const metrics = getMonthMetrics(appState.activeMonthId);
      const mRec = appState.months[appState.activeMonthId];
      mRec.isArchived = true;
      mRec.archivedAt = new Date().toISOString();
      mRec.snapshot = JSON.parse(JSON.stringify(metrics));
      saveState();
      renderAll();
      showToast('تم إقفال وأرشفة الشهر وإضافته للأرباح 🔒');
    }

    function unarchiveCurrentMonth() {
      const mRec = appState.months[appState.activeMonthId];
      mRec.isArchived = false;
      mRec.snapshot = null;
      saveState();
      renderAll();
      showToast('تم فك القفل عن الشهر');
    }

    function renderCustomersSection() {
      const filtered = appState.customers.filter(c =>
        c.name.toLowerCase().includes(customerSearch.toLowerCase()) ||
        (c.phone && c.phone.includes(customerSearch))
      );

      const customersHtml = filtered.map(c => {
        const safePhone = (c.phone || '').replace(/'/g, "\\'");
        const safeName = (c.name || '').replace(/'/g, "\\'");
        return `
          <div style="padding:11px; border:1px solid var(--border); border-radius:12px; margin-top:8px;">
            <div class="flex items-center justify-between gap-2">
              <span class="full-client-name">${c.name}</span>
              <span class="badge ${c.active ? 'badge-success' : 'badge-danger'}">${c.active ? 'نشط' : 'موقوف'}</span>
            </div>
            <div class="text-xs text-muted mt-1">
              باقة: <strong>${c.gb} جيجا</strong> (${getPackagePrice(c.gb)} ج.م) ${c.phone ? `• ${c.phone}` : ''}
            </div>
            ${c.notes ? `<div class="text-xs text-primary mt-1">ملاحظة: ${c.notes}</div>` : ''}
            <div class="flex gap-1 flex-wrap mt-2" style="padding-top:6px; border-top:1px dashed var(--border);">
              <button type="button" onclick="copyPhoneNumber('${safePhone}', '${safeName}')" class="btn btn-copy-pill">${ICON_COPY} نسخ</button>
              <button type="button" onclick="openWhatsAppForCustomer('${c.id}', false)" class="btn btn-wa">${ICON_WA} واتساب</button>
              <button type="button" onclick="openCustomerInvoiceModal('${c.id}')" class="btn btn-invoice-pill">📄 فاتورة</button>
              <button onclick="openCustomerModal('${c.id}')" class="btn btn-outline btn-xs">تعديل</button>
              <button onclick="deleteCustomer('${c.id}')" class="btn btn-danger btn-xs">حذف</button>
            </div>
          </div>
        `;
      }).join('');

      const linesListHtml = appState.lines.map(line => `
        <div style="padding:10px; border:1px solid var(--border); border-radius:12px; margin-top:8px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div class="font-extrabold text-sm">${line.name}</div>
            <div class="text-xs text-muted">السعة: <strong>${line.capacityGb} جيجا</strong> • التكلفة: <strong>${line.monthlyCost} ج.م</strong></div>
          </div>
          <div class="flex gap-1">
            <button onclick="openLineModal('${line.id}')" class="btn btn-outline btn-xs">تعديل</button>
            ${appState.lines.length > 1 ? `<button onclick="deleteLine('${line.id}')" class="btn btn-danger btn-xs">حذف</button>` : ''}
          </div>
        </div>
      `).join('');

      return `
        <div class="card">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-base font-extrabold">العملاء (${appState.customers.length})</h3>
            <button onclick="openCustomerModal()" class="btn btn-primary btn-xs">+ عميل جديد</button>
          </div>
          <input type="text" class="input input-sm mb-2" placeholder="بحث بالاسم أو الرقم..."
                 value="${customerSearch}" oninput="customerSearch = this.value; renderContent();" />
          ${customersHtml}
        </div>

        <div class="card">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-base font-extrabold">إدارة الخطوط (${appState.lines.length})</h3>
            <button onclick="openLineModal()" class="btn btn-primary btn-xs">+ إضافة خط</button>
          </div>
          ${linesListHtml}
        </div>
      `;
    }

    function openCustomerModal(customerId = null) {
      const existing = customerId ? appState.customers.find(c => c.id === customerId) : null;
      const pkgOptions = [...appState.packages].sort((a, b) => a.gb - b.gb).map(p =>
        `<option value="${p.gb}" ${existing && Number(existing.gb) === Number(p.gb) ? 'selected' : ''}>${p.gb} جيجا (${p.price} ج.م)</option>`
      ).join('');

      openModal(`
        <h3 class="text-lg font-extrabold mb-3">${existing ? 'تعديل بيانات عميل' : 'إضافة عميل جديد'}</h3>
        <div class="form-group">
          <label class="form-label">اسم العميل *</label>
          <input type="text" id="cust-name" class="input" value="${existing ? existing.name : ''}" />
        </div>
        <div class="form-group">
          <label class="form-label">الرقم الأساسي</label>
          <input type="tel" id="cust-phone" class="input" value="${existing ? existing.phone : ''}" />
        </div>
        <div class="form-group">
          <label class="form-label">الباقة</label>
          <select id="cust-gb" class="input">${pkgOptions}</select>
        </div>
        <div class="form-group">
          <label class="form-label">الحالة</label>
          <select id="cust-active" class="input">
            <option value="true" ${!existing || existing.active ? 'selected' : ''}>نشط</option>
            <option value="false" ${existing && !existing.active ? 'selected' : ''}>موقوف</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">رقم بديل للواتساب / ملاحظات</label>
          <input type="text" id="cust-notes" class="input" value="${existing ? existing.notes : ''}" />
        </div>
        <div class="flex gap-2">
          <button onclick="saveCustomer('${customerId || ''}')" class="btn btn-primary w-full">حفظ</button>
          <button onclick="closeModal()" class="btn btn-outline">إلغاء</button>
        </div>
      `);
    }

    function saveCustomer(customerId) {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const gb = Number(document.getElementById('cust-gb').value);
      const active = document.getElementById('cust-active').value === 'true';
      const notes = document.getElementById('cust-notes').value.trim();
      if (!name) return showToast('أدخل اسم العميل');

      if (customerId) {
        const idx = appState.customers.findIndex(c => c.id === customerId);
        if (idx !== -1) appState.customers[idx] = { ...appState.customers[idx], name, phone, gb, active, notes };
      } else {
        appState.customers.push({ id: 'cust_' + Date.now(), name, phone, gb, active, notes });
      }
      saveState();
      closeModal();
      renderAll();
      showToast('تم حفظ بيانات العميل');
    }

    function deleteCustomer(customerId) {
      appState.customers = appState.customers.filter(c => c.id !== customerId);
      Object.values(appState.months).forEach(m => {
        if (!m.isArchived) {
          Object.keys(m.distributions).forEach(lId => {
            m.distributions[lId] = m.distributions[lId].map(id => id === customerId ? null : id);
          });
          delete m.merchantAssigned[customerId];
        }
      });
      saveState();
      renderAll();
      showToast('تم حذف العميل');
    }

    function openLineModal(lineId = null) {
      const existing = lineId ? appState.lines.find(l => l.id === lineId) : null;
      openModal(`
        <h3 class="text-lg font-extrabold mb-3">${existing ? `تعديل ${existing.name}` : 'إضافة خط جديد'}</h3>
        <div class="form-group">
          <label class="form-label">اسم الخط</label>
          <input type="text" id="line-name" class="input" value="${existing ? existing.name : `خط ${appState.lines.length + 1}`}" />
        </div>
        <div class="form-group">
          <label class="form-label">سعة الخط (جيجا)</label>
          <input type="number" id="line-cap" class="input" value="${existing ? existing.capacityGb : 130}" />
        </div>
        <div class="form-group">
          <label class="form-label">التكلفة الشهرية (ج.م)</label>
          <input type="number" id="line-cost" class="input" value="${existing ? existing.monthlyCost : 1695}" />
        </div>
        <div class="form-group">
          <label class="form-label">الحد الأقصى للمشتركين</label>
          <input type="number" id="line-slots" class="input" value="${existing ? existing.maxSlots : 6}" min="1" max="15" />
        </div>
        <div class="flex gap-2">
          <button onclick="saveLine('${lineId || ''}')" class="btn btn-primary w-full">حفظ</button>
          <button onclick="closeModal()" class="btn btn-outline">إلغاء</button>
        </div>
      `);
    }

    function saveLine(lineId) {
      const name = document.getElementById('line-name').value.trim();
      const capacityGb = Number(document.getElementById('line-cap').value) || 0;
      const monthlyCost = Number(document.getElementById('line-cost').value) || 0;
      const maxSlots = Math.max(1, Number(document.getElementById('line-slots').value) || 6);
      if (!name) return showToast('أدخل اسم الخط');

      if (lineId) {
        const idx = appState.lines.findIndex(l => l.id === lineId);
        if (idx !== -1) appState.lines[idx] = { ...appState.lines[idx], name, capacityGb, monthlyCost, maxSlots };
      } else {
        appState.lines.push({ id: 'line_' + Date.now(), name, capacityGb, monthlyCost, maxSlots });
      }
      saveState();
      closeModal();
      renderAll();
      showToast('تم حفظ الخط');
    }

    function deleteLine(lineId) {
      if (appState.lines.length <= 1) return;
      appState.lines = appState.lines.filter(l => l.id !== lineId);
      saveState();
      renderAll();
      showToast('تم حذف الخط');
    }

    /* ==========================================================================
       10. WHATSAPP BACKUP & RESTORE
       ========================================================================== */
    function sendWhatsAppBackup() {
      const encoded = encodeURIComponent(`WE_BACKUP_START\n${JSON.stringify(appState)}\nWE_BACKUP_END`);
      const url = `https://wa.me/?text=${encoded}`;
      const win = window.open(url, '_blank');
      if (!win) window.location.href = url;
    }

    function openPasteBackupModal() {
      openModal(`
        <h3 class="text-base font-extrabold mb-2">استعادة البيانات من كود واتساب</h3>
        <textarea id="paste-backup-box" class="input" rows="5" placeholder="الصق كود النسخة الاحتياطية هنا..."></textarea>
        <div class="flex gap-2 mt-3">
          <button onclick="processPastedBackup()" class="btn btn-primary w-full">استعادة الآن</button>
          <button onclick="closeModal()" class="btn btn-outline">إلغاء</button>
        </div>
      `);
    }

    function processPastedBackup() {
      try {
        let raw = document.getElementById('paste-backup-box').value.trim();
        raw = raw.replace('WE_BACKUP_START', '').replace('WE_BACKUP_END', '').trim();
        const parsed = sanitizeState(JSON.parse(raw));
        appState = parsed;
        saveState();
        closeModal();
        renderAll();
        showToast('تم استرجاع جميع البيانات بنجاح!');
      } catch (e) {
        showToast('الكود المنسوخ غير صالح');
      }
    }

    /* ==========================================================================
       11. MODAL ENGINE & BOOT
       ========================================================================== */
    function openModal(innerHtml) {
      const root = document.getElementById('modal-root');
      root.className = 'modal-backdrop';
      root.innerHTML = `<div class="modal-box">${innerHtml}</div>`;
      root.onclick = function(e) { if (e.target === root) closeModal(); };
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.className = 'hidden';
      root.innerHTML = '';
    }

    renderAll();
  </script>
</body>
</html>
