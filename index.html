<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#5c2d91" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="zoz Gold" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='26' fill='%235c2d91'/%3E%3Ctext x='64' y='79' font-family='Arial,sans-serif' font-size='44' font-weight='bold' text-anchor='middle' fill='white'%3EZZ%3C/text%3E%3C/svg%3E" />
  <title>zoz Gold - إدارة الخطوط والعملاء</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <style>
    :root {
      --primary: #5c2d91;
      --primary-dark: #431d6e;
      --primary-light: #7b42bc;
      --primary-bg: #f3ebf9;
      --whatsapp: #16a34a;
      --whatsapp-bg: #dcfce7;
      --bg-body: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --warning: #f59e0b;
      --warning-dark: #b45309;
      --warning-bg: #fffbeb;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 18px rgba(92, 45, 145, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      overflow-x: hidden;
      padding-bottom: 84px;
    }

    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .w-full { width: 100%; }
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.35rem; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .text-muted { color: var(--text-muted); }
    .text-primary { color: var(--primary); }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }
    .text-warning { color: var(--warning-dark); }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mb-1 { margin-bottom: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 14px 16px 16px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-icon-btn {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9px;
      height: 30px;
      padding: 0 9px;
      font-size: 0.76rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .header-icon-btn:active { transform: scale(0.95); }

    .month-bar {
      background: rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-md);
      padding: 6px 10px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .month-select {
      background: transparent;
      color: #fff;
      border: none;
      font-weight: 800;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      padding: 4px;
      flex: 1;
      text-align: center;
    }

    .month-select option {
      color: var(--text-main);
      background: #fff;
    }

    .month-nav-btn {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .kpi-card {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      border-inline-start: 4px solid var(--primary);
    }
    .kpi-card.success { border-inline-start-color: var(--success); }
    .kpi-card.warning { border-inline-start-color: var(--warning); }
    .kpi-card.danger { border-inline-start-color: var(--danger); }

    /* Buttons & Badges */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warning { background: var(--warning); color: #1e293b; }
    .btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--text-main); }
    .btn-soft { background: var(--primary-bg); color: var(--primary); }
    .btn-sm { padding: 7px 11px; font-size: 0.8rem; border-radius: var(--radius-sm); }
    .btn-xs { padding: 5px 9px; font-size: 0.74rem; border-radius: 8px; }

    .btn-copy-pill {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      color: #334155;
      border: 1.5px solid #cbd5e1;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.74rem;
      font-weight: 800;
    }
    .btn-copy-pill:active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-wa {
      background: var(--whatsapp-bg);
      color: var(--whatsapp);
      border: 1.5px solid #86efac;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.74rem;
      font-weight: 800;
    }
    .btn-wa:active {
      background: var(--whatsapp);
      color: #fff;
    }

    .btn-invoice-pill {
      background: #fef3c7;
      color: #92400e;
      border: 1.5px solid #fcd34d;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.74rem;
      font-weight: 800;
    }
    .btn-invoice-pill:active {
      background: #d97706;
      color: #fff;
      border-color: #d97706;
    }

    .btn-edit-pkg {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge-primary { background: var(--primary-bg); color: var(--primary); }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-warning { background: var(--warning-bg); color: var(--warning-dark); }
    .badge-neutral { background: #f1f5f9; color: #475569; }

    /* Payment Dots */
    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .status-dot.paid { background-color: var(--success); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
    .status-dot.partial { background-color: var(--warning); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.22); }
    .status-dot.unpaid { background-color: var(--danger); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2); }

    /* Form Controls */
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }
    .input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      color: var(--text-main);
      background: #fff;
      outline: none;
    }
    .input:focus { border-color: var(--primary); }
    .input-sm { padding: 7px 10px; font-size: 0.84rem; border-radius: var(--radius-sm); }

    /* Progress & Distribution Slots */
    .progress-track {
      width: 100%;
      height: 9px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin: 7px 0 4px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 999px;
    }
    .progress-fill.over { background: var(--danger); }
    .progress-fill.full { background: var(--success); }

    .line-total-box {
      background: linear-gradient(135deg, #f3ebf9 0%, #ede9fe 100%);
      border: 1.5px solid var(--primary-light);
      padding: 5px 11px;
      border-radius: 12px;
      text-align: center;
    }

    .slot-item {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      margin-top: 8px;
      background: #fff;
    }
    .slot-item.empty {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      border-style: dashed;
      cursor: pointer;
    }
    .slot-item.empty:hover { border-color: var(--primary); background: var(--primary-bg); }

    .full-client-name {
      font-weight: 800;
      font-size: 0.93rem;
      color: var(--text-main);
      word-break: break-word;
      white-space: normal;
      line-height: 1.35;
    }

    /* Analytics Bars */
    .chart-row {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }
    .chart-bar-bg {
      height: 12px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 5px;
    }
    .chart-bar-profit { background: linear-gradient(90deg, #10b981, #059669); height: 100%; }
    .chart-bar-loss { background: linear-gradient(90deg, #ef4444, #dc2626); height: 100%; }
    .chart-bar-open { background: #94a3b8; height: 100%; }

    .filter-chip {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      cursor: pointer;
    }
    .filter-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 68px;
      z-index: 60;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.67rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 2px;
    }
    .nav-btn svg { width: 20px; height: 20px; stroke-width: 2.1; }
    .nav-btn.active { color: var(--primary); }

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      padding: 12px;
    }
    @media (min-width: 540px) { .modal-backdrop { align-items: center; } }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 460px;
      border-radius: 22px;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      z-index: 9999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Lock / Login Screen */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(155deg, #2d124d 0%, #5c2d91 55%, #7b42bc 100%);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .lock-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 26px;
      padding: 26px 22px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .lock-logo {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      font-weight: 900;
      font-size: 1.25rem;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(92, 45, 145, 0.3);
    }
    .btn-fingerprint {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      border: 1.5px solid #334155;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 800;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-fingerprint:active { transform: scale(0.97); }

    /* Invoice Preview Styling */
    .invoice-preview-box {
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 18px;
      color: #1e293b;
      text-align: start;
    }
    .invoice-brand-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .invoice-meta-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 0.85rem;
    }
    .invoice-summary-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }

    .pkg-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-bottom: 8px;
      background: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- LOCK / LOGIN SCREEN -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-logo">zoz Gold</div>
      <h1 class="text-lg font-extrabold">zoz Gold</h1>
      <p id="login-subtitle" class="text-xs text-muted mb-3">إدارة الباقات والخطوط • محمي بكلمة مرور وبصمة</p>

      <div id="login-error-box" class="hidden text-xs font-bold text-danger mb-2" style="background:var(--danger-bg); padding:8px; border-radius:10px;"></div>

      <form onsubmit="handlePasswordLogin(event)" style="text-align:start;">
        <div class="form-group">
          <label id="lbl-login-user" class="form-label">اسم المستخدم</label>
          <input type="text" id="login-username" class="input" placeholder="أدخل اسم المستخدم" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label id="lbl-login-pass" class="form-label">كلمة المرور</label>
          <input type="password" id="login-password" class="input" placeholder="••••" autocomplete="current-password" required />
        </div>
        <button type="submit" id="btn-login-pass" class="btn btn-primary w-full" style="padding:12px; font-size:0.95rem;">
          🔓 دخول بالرقم السري
        </button>
      </form>

      <button type="button" onclick="loginWithFingerprint()" class="btn-fingerprint">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.1">
          <path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/>
        </svg>
        <span id="btn-login-bio">تسجيل / الدخول بالبصمة 👆</span>
      </button>

      <div id="fingerprint-hint" class="text-xs text-muted mt-2">
        الافتراضي: <strong>admin</strong> / <strong>1234</strong>
      </div>
    </div>
  </div>

  <!-- APP HEADER -->
  <header class="app-header">
    <div class="flex items-center justify-between gap-2">
      <div>
        <div class="flex items-center gap-2">
          <span style="background:#fff;color:var(--primary);font-weight:900;padding:2px 9px;border-radius:8px;font-size:0.85rem;">zoz Gold</span>
          <span class="font-extrabold text-base">zoz Gold</span>
        </div>
        <div class="text-xs" style="opacity:0.92;margin-top:2px;" id="header-status-label">يعمل أوفلاين بالكامل</div>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" onclick="openAddMonthModal()" class="header-icon-btn" id="btn-add-month">
          + شهر
        </button>
        <button type="button" onclick="openSettingsModal()" class="header-icon-btn" id="btn-open-settings">
          <span>⚙️</span>
          <span id="lbl-settings-btn">إعدادات</span>
        </button>
        <button type="button" onclick="logoutApp()" class="header-icon-btn" style="background:rgba(239,68,68,0.88);border-color:rgba(255,255,255,0.3);" id="btn-logout">
          <span>🚪</span>
          <span id="lbl-logout-btn">خروج</span>
        </button>
      </div>
    </div>

    <div class="month-bar">
      <button type="button" class="month-nav-btn" onclick="stepMonth(-1)" title="الشهر السابق">&#9654;</button>
      <select id="month-selector" class="month-select" onchange="selectMonth(this.value)"></select>
      <button type="button" class="month-nav-btn" onclick="stepMonth(1)" title="الشهر التالي">&#9664;</button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="app-content" class="container"></main>

  <!-- BOTTOM NAVIGATION (5 TABS) -->
  <nav class="bottom-nav">
    <button type="button
