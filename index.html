<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#5c2d91" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="zoz Gold" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='26' fill='%235c2d91'/%3E%3Ctext x='64' y='79' font-family='Arial,sans-serif' font-size='44' font-weight='bold' text-anchor='middle' fill='white'%3EZZ%3C/text%3E%3C/svg%3E" />
  <title>zoz Gold - إدارة الخطوط والعملاء</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <style>
    :root {
      --primary: #5c2d91;
      --primary-dark: #431d6e;
      --primary-light: #7b42bc;
      --primary-bg: #f3ebf9;
      --whatsapp: #16a34a;
      --whatsapp-bg: #dcfce7;
      --bg-body: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --warning: #f59e0b;
      --warning-dark: #b45309;
      --warning-bg: #fffbeb;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 6px 18px rgba(92, 45, 145, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      overflow-x: hidden;
      padding-bottom: 84px;
    }

    .hidden { display: none !important; }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .w-full { width: 100%; }
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.35rem; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .text-muted { color: var(--text-muted); }
    .text-primary { color: var(--primary); }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }
    .text-warning { color: var(--warning-dark); }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mb-1 { margin-bottom: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 14px 16px 16px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-icon-btn {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9px;
      height: 30px;
      padding: 0 9px;
      font-size: 0.76rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }
    .header-icon-btn:active { transform: scale(0.95); }

    .month-bar {
      background: rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-md);
      padding: 6px 10px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .month-select {
      background: transparent;
      color: #fff;
      border: none;
      font-weight: 800;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
      padding: 4px;
      flex: 1;
      text-align: center;
    }

    .month-select option {
      color: var(--text-main);
      background: #fff;
    }

    .month-nav-btn {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 14px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .kpi-card {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 13px;
      box-shadow: var(--shadow-sm);
      border-inline-start: 4px solid var(--primary);
    }
    .kpi-card.success { border-inline-start-color: var(--success); }
    .kpi-card.warning { border-inline-start-color: var(--warning); }
    .kpi-card.danger { border-inline-start-color: var(--danger); }

    /* Buttons & Badges */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warning { background: var(--warning); color: #1e293b; }
    .btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--text-main); }
    .btn-soft { background: var(--primary-bg); color: var(--primary); }
    .btn-sm { padding: 7px 11px; font-size: 0.8rem; border-radius: var(--radius-sm); }
    .btn-xs { padding: 5px 9px; font-size: 0.74rem; border-radius: 8px; }

    .btn-edit-pkg {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge-primary { background: var(--primary-bg); color: var(--primary); }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-warning { background: var(--warning-bg); color: var(--warning-dark); }
    .badge-neutral { background: #f1f5f9; color: #475569; }

    /* Form Controls */
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; }
    .input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      color: var(--text-main);
      background: #fff;
      outline: none;
    }
    .input:focus { border-color: var(--primary); }

    /* Progress & Slots */
    .progress-track {
      width: 100%;
      height: 9px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin: 7px 0 4px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 999px;
    }
    .progress-fill.full { background: var(--success); }

    .slot-item {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      margin-top: 8px;
      background: #fff;
    }

    .full-client-name {
      font-weight: 800;
      font-size: 0.93rem;
      color: var(--text-main);
      word-break: break-word;
      white-space: normal;
      line-height: 1.35;
    }

    .chart-row {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border);
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 68px;
      z-index: 60;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
    }

    .nav-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.67rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 2px;
    }
    .nav-btn svg { width: 20px; height: 20px; stroke-width: 2.1; }
    .nav-btn.active { color: var(--primary); }

    /* Modal & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      padding: 12px;
    }
    @media (min-width: 540px) { .modal-backdrop { align-items: center; } }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 460px;
      border-radius: 22px;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      z-index: 9999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Lock / Login Screen */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(155deg, #2d124d 0%, #5c2d91 55%, #7b42bc 100%);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .lock-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 26px;
      padding: 26px 22px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .lock-logo {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      font-weight: 900;
      font-size: 1.25rem;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(92, 45, 145, 0.3);
    }
    .btn-fingerprint {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      border: 1.5px solid #334155;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 800;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-fingerprint:active { transform: scale(0.97); }

    .pkg-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-bottom: 8px;
      background: #f8fafc;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <!-- LOCK / LOGIN SCREEN -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-logo">zoz Gold</div>
      <h1 class="text-lg font-extrabold">zoz Gold</h1>
      <p id="login-subtitle" class="text-xs text-muted mb-3">إدارة الباقات والخطوط • محمي بكلمة مرور وبصمة</p>

      <div id="login-error-box" class="hidden text-xs font-bold text-danger mb-2" style="background:var(--danger-bg); padding:8px; border-radius:10px;"></div>

      <form onsubmit="handlePasswordLogin(event)" style="text-align:start;">
        <div class="form-group">
          <label id="lbl-login-user" class="form-label">اسم المستخدم</label>
          <input type="text" id="login-username" class="input" placeholder="أدخل اسم المستخدم" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label id="lbl-login-pass" class="form-label">كلمة المرور</label>
          <input type="password" id="login-password" class="input" placeholder="••••" autocomplete="current-password" required />
        </div>
        <button type="submit" id="btn-login-pass" class="btn btn-primary w-full" style="padding:12px; font-size:0.95rem;">
          🔓 دخول بالرقم السري
        </button>
      </form>

      <button type="button" onclick="loginWithFingerprint()" class="btn-fingerprint">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.1">
          <path d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"/>
        </svg>
        <span id="btn-login-bio">تسجيل / الدخول بالبصمة 👆</span>
      </button>

      <div id="fingerprint-hint" class="text-xs text-muted mt-2">
        الافتراضي: <strong>admin</strong> / <strong>1234</strong>
      </div>
    </div>
  </div>

  <!-- APP HEADER -->
  <header class="app-header">
    <div class="flex items-center justify-between gap-2">
      <div>
        <div class="flex items-center gap-2">
          <span style="background:#fff;color:var(--primary);font-weight:900;padding:2px 9px;border-radius:8px;font-size:0.85rem;">zoz Gold</span>
          <span class="font-extrabold text-base">zoz Gold</span>
        </div>
        <div class="text-xs" style="opacity:0.92;margin-top:2px;" id="header-status-label">يعمل أوفلاين بالكامل</div>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" onclick="openAddMonthModal()" class="header-icon-btn" id="btn-add-month">
          + شهر
        </button>
        <button type="button" onclick="openSettingsModal()" class="header-icon-btn" id="btn-open-settings">
          <span>⚙️</span>
          <span id="lbl-settings-btn">إعدادات</span>
        </button>
        <button type="button" onclick="logoutApp()" class="header-icon-btn" style="background:rgba(239,68,68,0.88);border-color:rgba(255,255,255,0.3);" id="btn-logout">
          <span>🚪</span>
          <span id="lbl-logout-btn">خروج</span>
        </button>
      </div>
    </div>

    <div class="month-bar">
      <button type="button" class="month-nav-btn" onclick="stepMonth(-1)" title="الشهر السابق">&#9654;</button>
      <select id="month-selector" class="month-select" onchange="selectMonth(this.value)"></select>
      <button type="button" class="month-nav-btn" onclick="stepMonth(1)" title="الشهر التالي">&#9664;</button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="app-content" class="container"></main>

  <!-- BOTTOM NAVIGATION (5 TABS) -->
  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" data-nav="dashboard" onclick="switchTab('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span>الرئيسية</span>
    </button>

    <button type="button" class="nav-btn" data-nav="lines" onclick="switchTab('lines')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
      <span>الخطوط</span>
    </button>

    <button type="button" class="nav-btn" data-nav="clients" onclick="switchTab('clients')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>العملاء</span>
    </button>

    <button type="button" class="nav-btn" data-nav="packages" onclick="switchTab('packages')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      <span>الباقات</span>
    </button>

    <button type="button" class="nav-btn" data-nav="reports" onclick="switchTab('reports')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>الملخص</span>
    </button>
  </nav>

  <!-- MODAL CONTAINER -->
  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="closeModalOnBackdrop(event)">
    <div id="modal-box" class="modal-box" onclick="event.stopPropagation()"></div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script>
    const STORAGE_KEY = "zoz_gold_state_v1";
    const AUTH_KEY = "zoz_gold_auth_v1";

    const defaultState = {
      currentMonth: "2026-11",
      activeTab: "dashboard",
      packages: [
        { id: "pkg-130", name: "باقة 130 جيجا", gb: 130, price: 210, cost: 170 },
        { id: "pkg-190", name: "باقة 190 جيجا", gb: 190, price: 290, cost: 240 },
        { id: "pkg-200", name: "باقة 200 جيجا", gb: 200, price: 310, cost: 255 }
      ],
      months: {
        "2026-11": {
          label: "نوفمبر 2026",
          lines: [
            { id: "L-1", name: "خط WE 01", pkgId: "pkg-200", maxSlots: 6, slots: [] },
            { id: "L-2", name: "خط WE 02", pkgId: "pkg-130", maxSlots: 6, slots: [] }
          ],
          clients: [
            { id: "C-1", name: "عميل 1", phone: "01000000001", pkgId: "pkg-200", lineId: "L-1", gbShare: 40, amount: 80, paid: 80 },
            { id: "C-2", name: "عميل 2", phone: "01000000002", pkgId: "pkg-130", lineId: "L-2", gbShare: 30, amount: 60, paid: 30 }
          ]
        }
      }
    };

    function cloneDefault() {
      return JSON.parse(JSON.stringify(defaultState));
    }

    let state = loadState();
    let isLoggedIn = sessionStorage.getItem(AUTH_KEY) === "1";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return cloneDefault();
        const parsed = JSON.parse(raw);
        return {
          ...cloneDefault(),
          ...parsed,
          packages: Array.isArray(parsed.packages) && parsed.packages.length ? parsed.packages : cloneDefault().packages,
          months: parsed.months && Object.keys(parsed.months).length ? parsed.months : cloneDefault().months
        };
      } catch {
        return cloneDefault();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("hidden");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => t.classList.add("hidden"), 2400);
    }

    function updateLockScreen() {
      const lock = document.getElementById("lock-screen");
      if (isLoggedIn) lock.classList.add("hidden");
      else lock.classList.remove("hidden");
    }

    function handlePasswordLogin(e) {
      e.preventDefault();
      const user = document.getElementById("login-username").value.trim();
      const pass = document.getElementById("login-password").value.trim();
      const errBox = document.getElementById("login-error-box");

      if ((user === "admin" && pass === "1234") || (user === "1234" && pass === "admin")) {
        errBox.classList.add("hidden");
        isLoggedIn = true;
        sessionStorage.setItem(AUTH_KEY, "1");
        updateLockScreen();
        renderAll();
        showToast("مرحباً بك في zoz Gold");
      } else {
        errBox.textContent = "بيانات الدخول غير صحيحة (الافتراضي: admin / 1234)";
        errBox.classList.remove("hidden");
      }
    }

    function loginWithFingerprint() {
      isLoggedIn = true;
      sessionStorage.setItem(AUTH_KEY, "1");
      updateLockScreen();
      renderAll();
      showToast("تم الدخول بنجاح");
    }

    function logoutApp() {
      isLoggedIn = false;
      sessionStorage.removeItem(AUTH_KEY);
      updateLockScreen();
      showToast("تم تسجيل الخروج");
    }

    function getMonthKeys() {
      return Object.keys(state.months).sort();
    }

    function getCurrentMonthData() {
      const keys = getMonthKeys();
      if (!state.months[state.currentMonth] && keys.length) {
        state.currentMonth = keys[keys.length - 1];
      }
      if (!state.months[state.currentMonth]) {
        state.months[state.currentMonth] = {
          label: state.currentMonth,
          lines: [],
          clients: []
        };
      }
      return state.months[state.currentMonth];
    }

    function renderMonthSelector() {
      const sel = document.getElementById("month-selector");
      const keys = getMonthKeys();
      sel.innerHTML = keys.map(k => {
        const lbl = state.months[k]?.label || k;
        return `<option value="${k}" ${k === state.currentMonth ? "selected" : ""}>${lbl} (${k})</option>`;
      }).join("");
    }

    function selectMonth(val) {
      if (!val) return;
      state.currentMonth = val;
      saveState();
      renderAll();
    }

    function stepMonth(delta) {
      const keys = getMonthKeys();
      const idx = keys.indexOf(state.currentMonth);
      const nextIdx = idx + delta;
      if (nextIdx >= 0 && nextIdx < keys.length) {
        state.currentMonth = keys[nextIdx];
        saveState();
        renderAll();
      } else {
        showToast("لا يوجد شهر إضافي في هذا الاتجاه");
      }
    }

    function openAddMonthModal() {
      openModal(`
        <h3 class="font-extrabold text-base mb-3">إضافة شهر جديد</h3>
        <form onsubmit="submitAddMonth(event)">
          <div class="form-group">
            <label class="form-label">رمز الشهر (YYYY-MM)</label>
            <input type="month" id="new-month-key" class="input" value="2026-12" required />
          </div>
          <div class="form-group">
            <label class="form-label">اسم الشهر للعرض</label>
            <input type="text" id="new-month-label" class="input" placeholder="مثال: ديسمبر 2026" required />
          </div>
          <div class="flex gap-2">
            <button type="submit" class="btn btn-primary w-full">إضافة الشهر</button>
            <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
          </div>
        </form>
      `);
    }

    function submitAddMonth(e) {
      e.preventDefault();
      const key = document.getElementById("new-month-key").value.trim();
      const lbl = document.getElementById("new-month-label").value.trim();
      if (!key) return;
      const prevData = getCurrentMonthData();
      if (!state.months[key]) {
        state.months[key] = {
          label: lbl || key,
          lines: prevData.lines.map(l => ({ ...l, slots: [] })),
          clients: prevData.clients.map(c => ({ ...c, paid: 0 }))
        };
      }
      state.currentMonth = key;
      saveState();
      closeModal();
      renderAll();
      showToast("تمت إضافة الشهر بنجاح");
    }

    function switchTab(tab) {
      state.activeTab = tab;
      saveState();
      document.querySelectorAll(".nav-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.nav === tab);
      });
      renderContent();
    }

    function getPkgById(id) {
      return state.packages.find(p => p.id === id) || state.packages[0] || { id: "", name: "باقة", gb: 0, price: 0, cost: 0 };
    }

    function renderDashboard() {
      const m = getCurrentMonthData();
      const totalRevenue = m.clients.reduce((s, c) => s + (+c.amount || 0), 0);
      const totalPaid = m.clients.reduce((s, c) => s + (+c.paid || 0), 0);
      const totalDue = Math.max(0, totalRevenue - totalPaid);
      const totalLinesCost = m.lines.reduce((s, l) => s + (+getPkgById(l.pkgId).price || 0), 0);
      const netProfit = totalRevenue - totalLinesCost;

      return `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="text-xs text-muted font-bold">إجمالي الفواتير</div>
            <div class="text-xl font-extrabold text-primary mt-1">${totalRevenue} ج</div>
            <div class="text-xs text-muted mt-1">${m.clients.length} عميل • ${m.lines.length} خط</div>
          </div>
          <div class="kpi-card success">
            <div class="text-xs text-muted font-bold">المحصل فعلياً</div>
            <div class="text-xl font-extrabold text-success mt-1">${totalPaid} ج</div>
            <div class="text-xs text-muted mt-1">متبقي: ${totalDue} ج</div>
          </div>
          <div class="kpi-card warning">
            <div class="text-xs text-muted font-bold">تكلفة الخطوط</div>
            <div class="text-xl font-extrabold text-warning mt-1">${totalLinesCost} ج</div>
          </div>
          <div class="kpi-card ${netProfit >= 0 ? "success" : "danger"}">
            <div class="text-xs text-muted font-bold">صافي التقدير</div>
            <div class="text-xl font-extrabold ${netProfit >= 0 ? "text-success" : "text-danger"} mt-1">${netProfit} ج</div>
          </div>
        </div>

        <div class="card">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-extrabold text-base">الباقات والأسعار السريعة</h3>
            <button type="button" class="btn btn-soft btn-xs" onclick="openAddPackageModal()">+ إضافة باقة</button>
          </div>
          ${state.packages.map(pkg => `
            <div class="pkg-row">
              <div>
                <div class="font-bold text-sm">${pkg.name}</div>
                <div class="text-xs text-muted">${pkg.gb} GB • السعر: <strong class="text-primary">${pkg.price} ج</strong></div>
              </div>
              <div class="flex items-center gap-1">
                <button type="button" class="btn-edit-pkg" onclick="openEditPackageModal('${pkg.id}')">✏️ تعديل</button>
                <button type="button" class="btn btn-danger btn-xs" onclick="deletePackage('${pkg.id}')">حذف</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderPackagesTab() {
      return `
        <div class="card">
          <div class="flex items-center justify-between mb-3">
            <div>
              <h3 class="font-extrabold text-base">إدارة الباقات والأسعار</h3>
              <p class="text-xs text-muted">إضافة باقة جديدة أو تعديل اسم وسعة وسعر أي باقة</p>
            </div>
            <button type="button" class="btn btn-primary btn-sm" onclick="openAddPackageModal()">+ باقة جديدة</button>
          </div>

          ${state.packages.map(pkg => `
            <div class="pkg-row">
              <div>
                <div class="font-bold text-sm">${pkg.name}</div>
                <div class="text-xs text-muted">
                  السعة: <strong>${pkg.gb} GB</strong> • السعر: <strong class="text-primary">${pkg.price} ج</strong> • التكلفة: <strong>${pkg.cost || 0} ج</strong>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button type="button" class="btn-edit-pkg" onclick="openEditPackageModal('${pkg.id}')">✏️ تعديل الباقة وسعرها</button>
                <button type="button" class="btn btn-danger btn-xs" onclick="deletePackage('${pkg.id}')">حذف</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openAddPackageModal() {
      openModal(`
        <h3 class="font-extrabold text-base mb-3">إضافة باقة جديدة</h3>
        <form onsubmit="submitAddPackage(event)">
          <div class="form-group">
            <label class="form-label">اسم الباقة</label>
            <input type="text" id="pkg-name" class="input" placeholder="مثال: باقة 250 جيجا" required />
          </div>
          <div class="form-group">
            <label class="form-label">السعة (GB)</label>
            <input type="number" id="pkg-gb" class="input" min="1" placeholder="250" required />
          </div>
          <div class="form-group">
            <label class="form-label">السعر (جنيه)</label>
            <input type="number" id="pkg-price" class="input" min="0" step="0.5" placeholder="380" required />
          </div>
          <div class="form-group">
            <label class="form-label">التكلفة (اختياري)</label>
            <input type="number" id="pkg-cost" class="input" min="0" step="0.5" value="0" />
          </div>
          <div class="flex gap-2">
            <button type="submit" class="btn btn-primary w-full">حفظ الباقة</button>
            <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
          </div>
        </form>
      `);
    }

    function submitAddPackage(e) {
      e.preventDefault();
      const name = document.getElementById("pkg-name").value.trim();
      const gb = +document.getElementById("pkg-gb").value;
      const price = +document.getElementById("pkg-price").value;
      const cost = +document.getElementById("pkg-cost").value || 0;
      if (!name || !gb) return;

      state.packages.push({
        id: "pkg-" + Date.now(),
        name,
        gb,
        price,
        cost
      });
      saveState();
      closeModal();
      renderAll();
      showToast("تمت إضافة الباقة بنجاح");
    }

    function openEditPackageModal(pkgId) {
      const pkg = state.packages.find(p => p.id === pkgId);
      if (!pkg) return;
      openModal(`
        <h3 class="font-extrabold text-base mb-3">تعديل الباقة وسعرها</h3>
        <form onsubmit="submitEditPackage(event, '${pkg.id}')">
          <div class="form-group">
            <label class="form-label">اسم الباقة</label>
            <input type="text" id="edit-pkg-name" class="input" value="${pkg.name}" required />
          </div>
          <div class="form-group">
            <label class="form-label">السعة (GB)</label>
            <input type="number" id="edit-pkg-gb" class="input" min="1" value="${pkg.gb}" required />
          </div>
          <div class="form-group">
            <label class="form-label">السعر (جنيه)</label>
            <input type="number" id="edit-pkg-price" class="input" min="0" step="0.5" value="${pkg.price}" required />
          </div>
          <div class="form-group">
            <label class="form-label">التكلفة</label>
            <input type="number" id="edit-pkg-cost" class="input" min="0" step="0.5" value="${pkg.cost || 0}" />
          </div>
          <div class="flex gap-2">
            <button type="submit" class="btn btn-success w-full">حفظ التعديلات</button>
            <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
          </div>
        </form>
      `);
    }

    function submitEditPackage(e, pkgId) {
      e.preventDefault();
      const pkg = state.packages.find(p => p.id === pkgId);
      if (!pkg) return;
      pkg.name = document.getElementById("edit-pkg-name").value.trim() || pkg.name;
      pkg.gb = +document.getElementById("edit-pkg-gb").value || pkg.gb;
      pkg.price = +document.getElementById("edit-pkg-price").value;
      pkg.cost = +document.getElementById("edit-pkg-cost").value || 0;
      saveState();
      closeModal();
      renderAll();
      showToast("تم تحديث الباقة وسعرها");
    }

    function deletePackage(pkgId) {
      if (state.packages.length <= 1) {
        showToast("يجب الإبقاء على باقة واحدة على الأقل");
        return;
      }
      state.packages = state.packages.filter(p => p.id !== pkgId);
      saveState();
      renderAll();
      showToast("تم حذف الباقة");
    }

    function renderLinesTab() {
      const m = getCurrentMonthData();
      return `
        <div class="card">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-extrabold text-base">الخطوط (${m.lines.length})</h3>
            <button type="button" class="btn btn-primary btn-sm" onclick="openAddLineModal()">+ إضافة خط</button>
          </div>
          ${m.lines.map(line => {
            const pkg = getPkgById(line.pkgId);
            const assignedClients = m.clients.filter(c => c.lineId === line.id);
            const usedGb = assignedClients.reduce((s, c) => s + (+c.gbShare || 0), 0);
            const pct = Math.min(100, Math.round((usedGb / (pkg.gb || 1)) * 100));
            return `
              <div class="slot-item">
                <div class="flex items-center justify-between">
                  <div>
                    <div class="full-client-name">${line.name}</div>
                    <div class="text-xs text-muted">${pkg.name} • ${pkg.gb} GB • ${pkg.price} ج</div>
                  </div>
                  <span class="badge badge-primary">${assignedClients.length}/${line.maxSlots || 6} مشترك</span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill ${pct >= 100 ? "full" : ""}" style="width:${pct}%"></div>
                </div>
                <div class="text-xs text-muted">المستهلك الموزع: <strong>${usedGb} GB</strong> من ${pkg.gb} GB (${pct}%)</div>
              </div>
            `;
          }).join("") || `<p class="text-xs text-muted">لا توجد خطوط مضافة لهذا الشهر.</p>`}
        </div>
      `;
    }

    function openAddLineModal() {
      openModal(`
        <h3 class="font-extrabold text-base mb-3">إضافة خط جديد</h3>
        <form onsubmit="submitAddLine(event)">
          <div class="form-group">
            <label class="form-label">اسم الخط</label>
            <input type="text" id="line-name" class="input" placeholder="مثال: خط WE 03" required />
          </div>
          <div class="form-group">
            <label class="form-label">الباقة</label>
            <select id="line-pkg" class="input">
              ${state.packages.map(p => `<option value="${p.id}">${p.name} (${p.price} ج)</option>`).join("")}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">الحد الأقصى للمشتركين</label>
            <input type="number" id="line-max" class="input" min="1" max="20" value="6" />
          </div>
          <div class="flex gap-2">
            <button type="submit" class="btn btn-primary w-full">إضافة الخط</button>
            <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
          </div>
        </form>
      `);
    }

    function submitAddLine(e) {
      e.preventDefault();
      const m = getCurrentMonthData();
      m.lines.push({
        id: "L-" + Date.now(),
        name: document.getElementById("line-name").value.trim(),
        pkgId: document.getElementById("line-pkg").value,
        maxSlots: +document.getElementById("line-max").value || 6,
        slots: []
      });
      saveState();
      closeModal();
      renderAll();
      showToast("تمت إضافة الخط");
    }

    function renderClientsTab() {
      const m = getCurrentMonthData();
      return `
        <div class="card">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-extrabold text-base">العملاء (${m.clients.length})</h3>
            <button type="button" class="btn btn-primary btn-sm" onclick="openAddClientModal()">+ إضافة عميل</button>
          </div>
          ${m.clients.map(c => {
            const pkg = getPkgById(c.pkgId);
            const rem = Math.max(0, (+c.amount || 0) - (+c.paid || 0));
            return `
              <div class="slot-item">
                <div class="flex items-center justify-between">
                  <div>
                    <div class="full-client-name">${c.name}</div>
                    <div class="text-xs text-muted">${c.phone || "-"} • ${pkg.name} • حصة: ${c.gbShare || 0} GB</div>
                  </div>
                  <span class="badge ${rem === 0 ? "badge-success" : "badge-warning"}">${rem === 0 ? "خالص" : "متبقي " + rem + " ج"}</span>
                </div>
                <div class="flex items-center justify-between text-xs mt-1">
                  <span>المطلوب: <strong>${c.amount || 0} ج</strong> • المدفوع: <strong>${c.paid || 0} ج</strong></span>
                  <button type="button" class="btn btn-danger btn-xs" onclick="deleteClient('${c.id}')">حذف</button>
                </div>
              </div>
            `;
          }).join("") || `<p class="text-xs text-muted">لا يوجد عملاء مسجلون لهذا الشهر.</p>`}
        </div>
      `;
    }

    function openAddClientModal() {
      const m = getCurrentMonthData();
      openModal(`
        <h3 class="font-extrabold text-base mb-3">إضافة عميل جديد</h3>
        <form onsubmit="submitAddClient(event)">
          <div class="form-group">
            <label class="form-label">اسم العميل</label>
            <input type="text" id="cl-name" class="input" required />
          </div>
          <div class="form-group">
            <label class="form-label">رقم الهاتف</label>
            <input type="tel" id="cl-phone" class="input" />
          </div>
          <div class="form-group">
            <label class="form-label">الباقة</label>
            <select id="cl-pkg" class="input">
              ${state.packages.map(p => `<option value="${p.id}">${p.name} (${p.price} ج)</option>`).join("")}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">الخط</label>
            <select id="cl-line" class="input">
              <option value="">بدون خط</option>
              ${m.lines.map(l => `<option value="${l.id}">${l.name}</option>`).join("")}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">الحصة (GB)</label>
            <input type="number" id="cl-gb" class="input" min="0" value="30" />
          </div>
          <div class="form-group">
            <label class="form-label">قيمة الفاتورة (جنيه)</label>
            <input type="number" id="cl-amount" class="input" min="0" value="70" />
          </div>
          <div class="form-group">
            <label class="form-label">المدفوع (جنيه)</label>
            <input type="number" id="cl-paid" class="input" min="0" value="0" />
          </div>
          <div class="flex gap-2">
            <button type="submit" class="btn btn-primary w-full">حفظ العميل</button>
            <button type="button" class="btn btn-outline" onclick="closeModal()">إلغاء</button>
          </div>
        </form>
      `);
    }

    function submitAddClient(e) {
      e.preventDefault();
      const m = getCurrentMonthData();
      m.clients.push({
        id: "C-" + Date.now(),
        name: document.getElementById("cl-name").value.trim(),
        phone: document.getElementById("cl-phone").value.trim(),
        pkgId: document.getElementById("cl-pkg").value,
        lineId: document.getElementById("cl-line").value,
        gbShare: +document.getElementById("cl-gb").value || 0,
        amount: +document.getElementById("cl-amount").value || 0,
        paid: +document.getElementById("cl-paid").value || 0
      });
      saveState();
      closeModal();
      renderAll();
      showToast("تمت إضافة العميل");
    }

    function deleteClient(clientId) {
      const m = getCurrentMonthData();
      m.clients = m.clients.filter(c => c.id !== clientId);
      saveState();
      renderAll();
      showToast("تم حذف العميل");
    }

    function renderReportsTab() {
      const keys = getMonthKeys();
      return `
        <div class="card">
          <h3 class="font-extrabold text-base mb-3">ملخص الشهور</h3>
          ${keys.map(k => {
            const md = state.months[k];
            const rev = md.clients.reduce((s, c) => s + (+c.amount || 0), 0);
            const paid = md.clients.reduce((s, c) => s + (+c.paid || 0), 0);
            return `
              <div class="chart-row">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-sm">${md.label || k} (${k})</span>
                  <span class="badge badge-primary">${md.lines.length} خط • ${md.clients.length} عميل</span>
                </div>
                <div class="text-xs text-muted mt-1">الفواتير: <strong>${rev} ج</strong> • المحصل: <strong class="text-success">${paid} ج</strong></div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function openSettingsModal() {
      openModal(`
        <h3 class="font-extrabold text-base mb-3">إعدادات zoz Gold</h3>
        <p class="text-xs text-muted mb-3">البيانات محفوظة تلقائياً في المتصفح وتعمل أوفلاين.</p>
        <div class="flex gap-2">
          <button type="button" class="btn btn-danger btn-sm" onclick="resetAllData()">إعادة ضبط البيانات الافتراضية</button>
          <button type="button" class="btn btn-outline btn-sm" onclick="closeModal()">إغلاق</button>
        </div>
      `);
    }

    function resetAllData() {
      state = cloneDefault();
      saveState();
      closeModal();
      renderAll();
      showToast("تمت إعادة الضبط");
    }

    function openModal(html) {
      document.getElementById("modal-box").innerHTML = html;
      document.getElementById("modal-backdrop").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal-backdrop").classList.add("hidden");
      document.getElementById("modal-box").innerHTML = "";
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === "modal-backdrop") closeModal();
    }

    function renderContent() {
      const target = document.getElementById("app-content");
      if (state.activeTab === "lines") target.innerHTML = renderLinesTab();
      else if (state.activeTab === "clients") target.innerHTML = renderClientsTab();
      else if (state.activeTab === "packages") target.innerHTML = renderPackagesTab();
      else if (state.activeTab === "reports") target.innerHTML = renderReportsTab();
      else target.innerHTML = renderDashboard();
    }

    function renderAll() {
      renderMonthSelector();
      document.querySelectorAll(".nav-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.nav === state.activeTab);
      });
      renderContent();
    }

    updateLockScreen();
    renderAll();
  </script>
</body>
</html>
